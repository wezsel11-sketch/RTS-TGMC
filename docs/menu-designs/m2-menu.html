<!doctype html><meta charset=utf-8><link rel=stylesheet href=common.css>
<style>
:root{--acc:#ff7a3c;--line:rgba(255,160,100,.4)}

.title{left:80px;top:150px}.title small{letter-spacing:.5em;font-size:13px;color:var(--acc)}
