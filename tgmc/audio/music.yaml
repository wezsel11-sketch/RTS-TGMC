# Background music: every TGMC track that is music, plus its ambience loops as a calm backdrop. The themes are short
# (10 to 20 s, the lobby theme runs close to three minutes). tgmc/scripts/music.lua plays them in a faction-aware order
# and switches to the tense tracks in a fight; the playlist below is also what the in-game next/previous keys walk.
