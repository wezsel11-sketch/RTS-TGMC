# Background music: 23 full-length songs by Kevin MacLeod (incompetech.com, Creative Commons: By Attribution 4.0; the artist is in every title,
# which the in-game music player shows, and the README lists the credits), plus TGMC's ambience loops as a calm backdrop. The songs are downloaded
# when the mod is built (mod/build_sounds.py, pinned in mod/open-music.sha256). tgmc/scripts/music.lua plays them in a faction-aware order and
# switches to the shorter combat songs in a fight; the playlist below is also what the in-game next/previous keys walk.
