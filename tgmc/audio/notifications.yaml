# Notification sounds for the mod. Files live in audio/ (built by mod/build_sounds.py).
# Placeholders: every name maps to a TGMC clip we already convert.
# Names are bare: the engine appends DefaultVariant to each one.
Sounds:
	DefaultVariant: .ogg
	Notifications:
		ChatLine: audio/runner-hiss
		ChatLineSound: audio/runner-hiss
		ClickDisabledSound: audio/ui-deny
		ClickSound: audio/ui-click
		DevLevelUp: audio/rifle-fire
		HideReplayChat: audio/runner-hiss
		LobbyOptionChangedSound: audio/ui-ping
		OpenGeneralChat: audio/runner-hiss
		OpenTeamChat: audio/runner-hiss
		PlayerJoinedSound: audio/ui-ping
		PlayerLeftSound: audio/runner-hiss
		PowerDown: audio/rifle-fire
		RadarDown: audio/rifle-fire
		RadarUp: audio/rifle-fire
		TransientLineSound: audio/runner-hiss
