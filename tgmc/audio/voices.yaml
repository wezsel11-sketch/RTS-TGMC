# Voice sets. Clips are built by mod/build_sounds.py. The phrases are the ones the traits ask for: Select (clicked),
# Action (given a move order), Attack (given an attack order) and Die (killed); the marines have three more, see below. Pools pick a clip at random without
# repeating until every clip has played.
#
# Marines come in two recordings of each clip, male and female. Prefixes picks one per marine by its actor id, so a
# squad is a mix and each marine keeps the same voice. The clip names below are bare; the full file name is
# <prefix><clip>.ogg, for example marine-f-warcry-6.ogg. The audio folder is mounted as its own
# package (see mod.yaml), so sounds are referred to by file name alone.

# TGMC's marines are players, so it has no spoken acknowledgements: a marine answers a click or a move order with a burst of
# radio static and shouts a warcry only when sent to attack. Pain, Medic and Hugged are played by CriesInPain and Infestable
# (tgmc/code/Pain.cs, Infestation.cs): hurt, badly hurt with no healer near, and a facehugger latching on.
MarineVoice:
	DefaultVariant: .ogg
	Prefixes:
		marines: marine-m-, marine-f-
		som: marine-m-, marine-f-
		xenos: marine-m-, marine-f-
		Random: marine-m-, marine-f-
	Voices:
		Select: radio
		Action: radio
		Attack: warcry-1, warcry-2, warcry-3, warcry-4, warcry-5, warcry-6, warcry-7, warcry-8, warcry-9, warcry-10, warcry-11, warcry-12, warcry-13, warcry-14, warcry-15, warcry-16, warcry-17, warcry-18, warcry-19, grenadethrow-1, grenadethrow-2, grenadethrow-3
		Die: scream-1, scream-2, scream-3, scream-4, scream-5, gored-1, gored-2
		Pain: pain-1, pain-2, pain-3
		Medic: medic-1
		Hugged: facehugged-1, facehugged-2

# The corpsman is the medic: no call for one.
CorpsmanVoice:
	DefaultVariant: .ogg
	Prefixes:
		marines: marine-m-, marine-f-
		som: marine-m-, marine-f-
		xenos: marine-m-, marine-f-
		Random: marine-m-, marine-f-
	Voices:
		Select: radio
		Action: radio
		Attack: warcry-2, warcry-3, warcry-5, warcry-15, warcry-17, warcry-18
		Die: scream-1, scream-2, scream-3, scream-4, scream-5, gored-1, gored-2
		Pain: pain-1, pain-2, pain-3
		Hugged: facehugged-1, facehugged-2

# The synthetic: TGMC's robot voice. No facehugger latches onto it and it does not call for a medic.
SynthVoice:
	DefaultVariant: .ogg
	Voices:
		Select: synth-yes
		Action: synth-yes
		Attack: robot-warcry-1, robot-warcry-2, robot-warcry-3
		Die: robot-scream-1, robot-scream-2, robot-scream-3
		Pain: robot-pain-1, robot-pain-2, robot-pain-3

# Xenos: one set per caste, no gender.
RunnerVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-larva-1, xeno-larva-2, xeno-larva-3, xeno-larva-4
		Action: xeno-pounce-1, xeno-pounce-2, xeno-larva-2, xeno-growl-1
		Attack: xeno-pounce-1, xeno-larva-1, xeno-larva-4, xeno-roar-10
		Die: xeno-death-small, xeno-death-2

HunterVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-growl-1, xeno-growl-2, xeno-roar-8, xeno-roar-10
		Action: xeno-roar-1, xeno-roar-2, xeno-roar-3, xeno-roar-4
		Attack: xeno-roar-5, xeno-roar-6, xeno-roar-7, xeno-roar-9, xeno-roar-11, xeno-roar-12
		Die: xeno-death-1, xeno-death-2

# The Queen: a hunter's voice, but she dies with the long screech of the Queen's own cry.
QueenVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-growl-1, xeno-growl-2, xeno-roar-8, xeno-roar-10
		Action: xeno-roar-1, xeno-roar-2, xeno-roar-3, xeno-roar-4
		Attack: xeno-roar-5, xeno-roar-6, xeno-roar-7, xeno-roar-9, xeno-roar-11, xeno-roar-12
		Die: xeno-screech

SentinelVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-talk-1, xeno-talk-2, xeno-talk-3
		Action: xeno-hiss-1, xeno-hiss-2, xeno-hiss-3
		Attack: acid-spit-1, acid-spit-2, xeno-hiss-2
		Die: xeno-death-2, xeno-yell

DroneVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-talk-1, xeno-talk-3
		Action: xeno-talk-2, xeno-growl-4
		Attack: xeno-hiss-1, xeno-hiss-2
		Die: xeno-help-1, xeno-help-2

# Facehuggers hiss and skitter; larvae squeal.
HuggerVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-hiss-1, xeno-hiss-2
		Action: xeno-hiss-3, xeno-pounce-2
		Attack: xeno-pounce-1, xeno-pounce-2
		Die: xeno-death-small

LarvaVoice:
	DefaultVariant: .ogg
	Voices:
		Select: xeno-larva-1, xeno-larva-3
		Action: xeno-larva-2, xeno-larva-4
		Attack: xeno-larva-1, xeno-larva-4
		Die: xeno-death-small

# Structures: a click when selected or ordered, and their own noise when destroyed.
MarineStructureVoice:
	DefaultVariant: .ogg
	Voices:
		Select: ui-click
		Action: ui-click
		Attack: ui-click
		Die: explosion-1, explosion-2, explosion-3, explosion-big

XenoStructureVoice:
	DefaultVariant: .ogg
	Voices:
		Select: resin-build
		Action: resin-build
		Attack: resin-build
		Die: resin-break-1, resin-break-2, turret-death
