# TGMC command sidebar for players. Lives on the right, 240px wide, over the map view.
# The map viewport is narrowed to match in tgmc/chrome/ingame.yaml.

Container@PLAYER_WIDGETS:
	Logic: LoadIngameChatLogic
	Children:
		Container@CHAT_ROOT:
		LogicKeyListener@PLAYER_KEYHANDLER:
			Logic: RemoveFromControlGroupHotkeyLogic
				RemoveFromControlGroupKey: RemoveFromControlGroup
		ControlGroups@CONTROLGROUPS:
			SelectGroupKeyPrefix: ControlGroupSelect
			CreateGroupKeyPrefix: ControlGroupCreate
			AddToGroupKeyPrefix: ControlGroupAddTo
			CombineWithGroupKeyPrefix: ControlGroupCombineWith
			JumpToGroupKeyPrefix: ControlGroupJumpTo
		LogicTicker@SIDEBAR_TICKER:
		Background@TGMC_SIDEBAR:
			Logic: MenuButtonsChromeLogic
			X: WINDOW_WIDTH - 240
			Y: 0
			Width: 240
			Height: WINDOW_HEIGHT
			Background: tgui-window
			Children:
				Background@TITLE_BAR:
					X: 0
					Y: 0
					Width: PARENT_WIDTH
					Height: 36
					Background: tgui-titlebar
				Label@HEADER:
					X: 8
					Y: 6
					Width: PARENT_WIDTH - 16
					Height: 22
					Text: hud-header
					Font: Bold
					Align: Center
				Label@FACTION:
					X: 8
					Y: 26
					Width: PARENT_WIDTH - 16
					Height: 16
					Text: hud-faction
					Font: Tiny
					Align: Center
				Background@RADAR_FRAME:
					X: 8
					Y: 48
					Width: 224
					Height: 160
					Background: tgmc-radar-frame
					Logic: IngameRadarDisplayLogic
					Children:
						LogicTicker@RADAR_TICKER:
						Radar@RADAR_MINIMAP:
							WorldInteractionController: INTERACTION_CONTROLLER
							X: 2
							Y: 2
							Width: 220
							Height: 156
				Container@SIDEBAR_PRODUCTION:
					Logic: ClassicProductionLogic
					X: 4
					Y: 214
					Width: 232
					Height: PARENT_HEIGHT - 322
					Children:
						LogicTicker@PRODUCTION_TICKER:
						ProductionPalette@PRODUCTION_PALETTE:
							X: 34
							Columns: 3
							IconSize: 62, 46
							IconMargin: 1, 1
							TooltipContainer: TOOLTIP_CONTAINER
							ReadyText: productionpalette-sidebar-production-palette.ready
							HoldText: productionpalette-sidebar-production-palette.hold
							HotkeyPrefix: Production
							HotkeyCount: 24
							SelectProductionBuildingHotkey: SelectProductionBuilding
						Container@PRODUCTION_TYPES:
							X: 2
							Width: 28
							Height: 93
							Children:
								ProductionTypeButton@INFANTRY:
									Width: 28
									Height: 28
									VisualHeight: 0
									Background: sidebar-button
									ProductionGroup: Infantry
									Children:
										Image@ICON:
											X: 6
											Y: 6
											ImageCollection: production-icons
								ProductionTypeButton@XENO:
									Y: 31
									Width: 28
									Height: 28
									VisualHeight: 0
									Background: sidebar-button
									ProductionGroup: Xeno
									Children:
										Image@ICON:
											X: 6
											Y: 6
											ImageCollection: production-icons
								ProductionTypeButton@BUILD:
									Y: 62
									Width: 28
									Height: 28
									VisualHeight: 0
									Background: sidebar-button
									ProductionGroup: Build
									Children:
										Image@ICON:
											X: 6
											Y: 6
											ImageCollection: production-icons
				Background@READOUT_PANEL:
					X: 8
					Y: PARENT_HEIGHT - 98
					Width: 224
					Height: 56
					Background: tgui-card
					Children:
						Label@GAME_TIMER:
							Logic: GameTimerLogic
							X: 8
							Y: 6
							Width: PARENT_WIDTH - 16
							Height: 20
							Align: Center
							Font: TinyBold
						Label@CASH_LABEL:
							X: 10
							Y: 28
							Width: 100
							Height: 20
							Text: hud-cash
							Font: Tiny
						LabelWithTooltip@CASH:
							Logic: IngameCashCounterLogic
							X: 8
							Y: 28
							Width: PARENT_WIDTH - 16
							Height: 20
							Align: Right
							Font: Bold
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
				MenuButton@OPTIONS_BUTTON:
					X: 8
					Y: PARENT_HEIGHT - 34
					Width: 224
					Height: 26
					Background: sidebar-button
					Key: escape
					Text: hud-menu
					Font: Bold
					DisableWorldSounds: true
					VisualHeight: 0
