# TGMC main menu. Derived from OpenRA's mods/common/chrome/mainmenu.yaml (GPL-3.0).
# Widget IDs are unchanged so MainMenuLogic still finds them.
# Command deck (docs/menu-designs/m2-menu.png): the battle shows behind; title top left, news top right, the main menu as a row of
# cards along the bottom, each sub-menu a glass panel on the left. Was a green terminal with the title and an INTEL panel.
# Changes: each sub-menu is a TGUI window (drawn by the sub-menu, so it vanishes when the lobby or another screen opens), buttons use the tab style, and each sub-menu has a title bar.

Container@MAINMENU:
	Logic: MainMenuLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		Container@MENU_SHOT:
			Logic: MenuShotLogic
		Label@MENU_KICKER:
			X: 50
			Y: 40
			Width: 400
			Height: 20
			Text: menu-header
			Font: Bold
			TextColor: FFC454
			Contrast: true
		Label@MENU_TITLE:
			X: 50
			Y: 62
			Width: WINDOW_WIDTH - 100
			Height: 50
			Text: menu-title
			Font: Title
			TextColor: F0F0E6
			Contrast: true
		Label@MENU_PITCH:
			X: 50
			Y: 116
			Width: WINDOW_WIDTH - 100
			Height: 24
			Text: menu-subtitle
			Font: MediumBold
			TextColor: C8CCD0
			Contrast: true
		Background@MENU_NEWS:
			X: WINDOW_WIDTH - 410
			Y: 40
			Width: 360
			Height: 118
			Background: tgui-window
			Children:
				Label@NEWS_head:
					X: 16
					Y: 12
					Width: PARENT_WIDTH - 32
					Height: 20
					Text: menu-news-head
					Font: Bold
					TextColor: FFC454
				Label@NEWS_1:
					X: 16
					Y: 38
					Width: PARENT_WIDTH - 32
					Height: 20
					Text: menu-news-1
					Font: Regular
					TextColor: F0F0E6
				Label@NEWS_2:
					X: 16
					Y: 64
					Width: PARENT_WIDTH - 32
					Height: 20
					Text: menu-news-2
					Font: Regular
					TextColor: F0F0E6
				Label@NEWS_3:
					X: 16
					Y: 90
					Width: PARENT_WIDTH - 32
					Height: 20
					Text: menu-news-3
					Font: Regular
					TextColor: F0F0E6
		Label@VERSION_LABEL:
			Logic: VersionLabelLogic
			X: 50
			Y: WINDOW_HEIGHT - 40
			Width: 300
			Height: 25
			Align: Left
			TextColor: C8CCD0
			Font: Regular
			Shadow: true
		Container@MENUS:
			X: 50
			Y: 170
			Width: 340
			Height: 340
			Children:
				Background@MAIN_MENU:
					Y: WINDOW_HEIGHT - 170 - 160
					Width: WINDOW_WIDTH - 100
					Height: 124
					Background: tgui-window
					Children:
						Label@MAINMENU_LABEL_TITLE:
							X: 14
							Y: 8
							Width: 340
							Height: 20
							Text: label-main-menu-title
