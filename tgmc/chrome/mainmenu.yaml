# TGMC main menu. Derived from OpenRA's mods/common/chrome/mainmenu.yaml (GPL-3.0).
# Widget IDs and positions are unchanged so MainMenuLogic still finds them.
# Terminal look (green on black, see mod/make_chrome.py): a wide menu list on the left, the title and an INTEL panel.
# Changes: each sub-menu is a TGUI window (drawn by the sub-menu, so it vanishes when the lobby or another screen opens), buttons use the tab style, and each sub-menu has a title bar.

Container@MAINMENU:
	Logic: MainMenuLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		Background@BORDER:
			Background: mainmenu-border
			X: 0 - 15
			Y: 0 - 15
			Width: WINDOW_WIDTH + 30
			Height: WINDOW_HEIGHT + 30
		Container@MENU_SHOT:
			Logic: MenuShotLogic
		Label@TERM_HEADER:
			X: 50
			Y: 36
			Width: WINDOW_WIDTH - 100
			Height: 20
			Text: menu-header
			Font: Bold
			TextColor: FFCB5A
		Label@TERM_TITLE:
			X: 50
			Y: 70
			Width: WINDOW_WIDTH - 100
			Height: 50
			Text: menu-title
			Font: Title
			TextColor: 7DFF9A
		Label@TERM_SUBTITLE:
			X: 50
			Y: 122
			Width: WINDOW_WIDTH - 100
			Height: 24
			Text: menu-subtitle
			Font: MediumBold
			TextColor: 3CB85A
		Background@TERM_INTEL:
			X: WINDOW_WIDTH - 430
			Y: 160
			Width: 380
			Height: 220
			Background: term-window
			Children:
				Label@INTEL_HEAD:
					X: 18
					Y: 14
					Width: PARENT_WIDTH - 36
					Height: 20
					Text: menu-intel-head
					Font: Bold
					TextColor: FFCB5A
				Label@INTEL_1:
					X: 18
					Y: 46
					Width: PARENT_WIDTH - 36
					Height: 20
					Text: menu-intel-1
					Font: Regular
					TextColor: 7DFF9A
				Label@INTEL_2:
					X: 18
					Y: 76
					Width: PARENT_WIDTH - 36
					Height: 20
					Text: menu-intel-2
					Font: Regular
					TextColor: 7DFF9A
				Label@INTEL_3:
					X: 18
					Y: 106
					Width: PARENT_WIDTH - 36
					Height: 20
					Text: menu-intel-3
					Font: Regular
					TextColor: 7DFF9A
				Label@INTEL_4:
					X: 18
					Y: 136
					Width: PARENT_WIDTH - 36
					Height: 20
					Text: menu-intel-4
					Font: Regular
					TextColor: 7DFF9A
		Label@VERSION_LABEL:
			Logic: VersionLabelLogic
			X: 50
			Y: WINDOW_HEIGHT - 40
			Width: 300
			Height: 25
			Align: Left
			TextColor: 3CB85A
			Font: Regular
			Shadow: true
		Container@MENUS:
			X: 50
			Y: 170
			Width: 340
			Height: 340
			Children:
				Background@MAIN_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Background: term-window
					Children:
						Background@MAIN_TITLE_BAR:
							X: 0
							Y: 0
							Width: PARENT_WIDTH
							Height: 52
							Background: term-titlebar
						Label@MAINMENU_LABEL_TITLE:
							X: 0
							Y: 22
							Width: 340
							Height: 30
							Text: label-main-menu-title
							Align: Center
							Font: Bold
							TextColor: FFCB5A
						Button@SINGLEPLAYER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 280
							Height: 30
							Text: label-singleplayer-title
							Font: Bold
							TextColor: 7DFF9A
							Background: term-tab
						Button@MULTIPLAYER_BUTTON:
