							Height: 30
							Text: button-back
							Font: Bold
							TextColor: 7DFF9A
							Background: term-tab
				Background@MAP_EDITOR_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Background: term-window
					Children:
						Background@MAP_EDITOR_TITLE_BAR:
							X: 0
							Y: 0
							Width: PARENT_WIDTH
							Height: 52
							Background: term-titlebar
						Label@MAP_EDITOR_MENU_TITLE:
							X: 0
