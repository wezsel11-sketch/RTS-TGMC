# Skirmish AI, in three strengths: Easy, Normal (the "Skirmish AI" in the lobby) and Hard. One bot drives either faction: it only
# builds what its queues offer, so a marine bot trains marines and a xeno bot trains xenos. The map places the starting base;
# the bot then builds generators, tech and turrets, trains units and sends them out in squads. Pattern: OpenRA mods/ra/rules/ai.yaml.
#
# The three differ in how soon they attack and how much cash they hold back:
#   Easy    waits about two minutes before its first attack, sends big groups, and only trains with plenty in the bank
#   Normal  the strength the balance runs were tuned on
#   Hard    attacks in small, frequent waves, trains whenever it can, and leans on the stronger units
# Xenos are cheap and fast, so each xeno bot gathers a bigger group than the marine bot of the same strength. (A squad's size
# is SquadSize plus a random 0 to SquadSizeRandomBonus - 1 units, not a percentage.)
Player:
	ModularBot@EasyAI:
		Name: bot-easy-ai.name
		Type: easy
	ModularBot@SkirmishAI:
		Name: bot-skirmish-ai.name
		Type: skirmish
	ModularBot@HardAI:
		Name: bot-hard-ai.name
		Type: hard
	GrantConditionOnBotOwner@all:
		Condition: enable-skirmish-ai
		Bots: easy, skirmish, hard
	GrantConditionOnBotOwner@easy:
		Condition: ai-easy
		Bots: easy
	GrantConditionOnBotOwner@normal:
		Condition: ai-normal
		Bots: skirmish
	GrantConditionOnBotOwner@hard:
		Condition: ai-hard
		Bots: hard
	GrantConditionOnFaction@xenos:
		Condition: faction-xenos
		Factions: xenos
	UnitBuilderBotModule@easy:
		RequiresCondition: ai-easy
		UnitQueues: Infantry, Xeno
		ProductionMinCashRequirement: 160
		UnitsToBuild:
			rifleman: 80
			medic: 10
			engineer: 10
			smartgunner: 15
			grenadier: 10
			runner: 70
			hunter: 20
			sentinel: 20
			warrior: 8
			queen: 10
	UnitBuilderBotModule@normal:
		RequiresCondition: ai-normal
		UnitQueues: Infantry, Xeno
		ProductionMinCashRequirement: 60
		UnitsToBuild:
			rifleman: 70
			medic: 15
			engineer: 15
			smartgunner: 25
			grenadier: 20
			runner: 60
			hunter: 30
			sentinel: 30
			warrior: 15
			queen: 10
	UnitBuilderBotModule@hard:
		RequiresCondition: ai-hard
		UnitQueues: Infantry, Xeno
		ProductionMinCashRequirement: 30
		UnitsToBuild:
			rifleman: 55
			medic: 20
			engineer: 15
			smartgunner: 35
			grenadier: 25
			runner: 40
			hunter: 40
			sentinel: 35
			warrior: 25
			queen: 10
	# The bot has no builder to walk around, so its cryo pod and silo give it the build area (structures.yaml) and it
	# places each finished structure in a ring around them. It never builds walls. The refinery counts are zeroed
	# because the module otherwise holds back all unit production until it owns a refinery.
	BaseBuilderBotModule@skirmish:
		RequiresCondition: enable-skirmish-ai
		BuildingQueues: MarineBuild, XenoBuild
		ConstructionYardTypes: cryo-pod, resin-silo
		InititalMinimumRefineryCount: 0
		AdditionalMinimumRefineryCount: 0
		NewProductionCashThreshold: 0
		MinBaseRadius: 3
		MaxBaseRadius: 9
		ProductionMinCashRequirement: 100
		BuildingFractions:
			miner: 25
			weed-node: 25
			vendor: 8
			cryo-pod: 6
			mini-silo: 8
			armory: 8
			ordnance-depot: 8
			evolution-tower: 8
			maturity-tower: 8
			sentry-turret: 12
			resin-turret: 12
		BuildingLimits:
			miner: 6
			weed-node: 6
			vendor: 2
			cryo-pod: 2
			mini-silo: 3
			armory: 1
			ordnance-depot: 1
			evolution-tower: 1
			maturity-tower: 1
			sentry-turret: 4
			resin-turret: 4
		BuildingDelays:
			armory: 3000
			ordnance-depot: 6000
			evolution-tower: 3000
			maturity-tower: 6000
	SquadManagerBotModule@easy-marines:
		RequiresCondition: ai-easy && !faction-xenos
		SquadSize: 12
		SquadSizeRandomBonus: 8
		AttackForceInterval: 150
		MinimumAttackForceDelay: 3000
		ExcludeFromSquadsTypes: medic, engineer, drone, queen
		ConstructionYardTypes: cryo-pod, resin-silo
		ProtectionTypes: cryo-pod, vendor, resin-silo, mini-silo, sentry-turret, resin-turret, miner, weed-node, armory, ordnance-depot, evolution-tower, maturity-tower
	SquadManagerBotModule@easy-xenos:
		RequiresCondition: ai-easy && faction-xenos
		SquadSize: 20
		SquadSizeRandomBonus: 8
		AttackForceInterval: 150
		MinimumAttackForceDelay: 3000
		ExcludeFromSquadsTypes: medic, engineer, drone, queen
		ConstructionYardTypes: cryo-pod, resin-silo
		ProtectionTypes: cryo-pod, vendor, resin-silo, mini-silo, sentry-turret, resin-turret, miner, weed-node, armory, ordnance-depot, evolution-tower, maturity-tower
	SquadManagerBotModule@normal-marines:
		RequiresCondition: ai-normal && !faction-xenos
		SquadSize: 8
		SquadSizeRandomBonus: 20
		AttackForceInterval: 75
		MinimumAttackForceDelay: 0
		ExcludeFromSquadsTypes: medic, engineer, drone, queen
		ConstructionYardTypes: cryo-pod, resin-silo
		ProtectionTypes: cryo-pod, vendor, resin-silo, mini-silo, sentry-turret, resin-turret, miner, weed-node, armory, ordnance-depot, evolution-tower, maturity-tower
	SquadManagerBotModule@normal-xenos:
		RequiresCondition: ai-normal && faction-xenos
		SquadSize: 14
		SquadSizeRandomBonus: 20
		AttackForceInterval: 75
		MinimumAttackForceDelay: 0
		ExcludeFromSquadsTypes: medic, engineer, drone, queen
		ConstructionYardTypes: cryo-pod, resin-silo
		ProtectionTypes: cryo-pod, vendor, resin-silo, mini-silo, sentry-turret, resin-turret, miner, weed-node, armory, ordnance-depot, evolution-tower, maturity-tower
	SquadManagerBotModule@hard-marines:
		RequiresCondition: ai-hard && !faction-xenos
		SquadSize: 5
		SquadSizeRandomBonus: 5
		AttackForceInterval: 50
		MinimumAttackForceDelay: 0
		ExcludeFromSquadsTypes: medic, engineer, drone, queen
		ConstructionYardTypes: cryo-pod, resin-silo
		ProtectionTypes: cryo-pod, vendor, resin-silo, mini-silo, sentry-turret, resin-turret, miner, weed-node, armory, ordnance-depot, evolution-tower, maturity-tower
	SquadManagerBotModule@hard-xenos:
		RequiresCondition: ai-hard && faction-xenos
		SquadSize: 7
		SquadSizeRandomBonus: 5
		AttackForceInterval: 50
		MinimumAttackForceDelay: 0
		ExcludeFromSquadsTypes: medic, engineer, drone, queen
		ConstructionYardTypes: cryo-pod, resin-silo
		ProtectionTypes: cryo-pod, vendor, resin-silo, mini-silo, sentry-turret, resin-turret, miner, weed-node, armory, ordnance-depot, evolution-tower, maturity-tower
	# The Queen's Screech: the xeno bot fires it when at least three marines are bunched within five cells
	SupportPowerBotModule@screech:
		RequiresCondition: enable-skirmish-ai && faction-xenos
		Decisions:
			screech:
				OrderName: QueenScreech
				MinimumAttractiveness: 3
				Consideration@1:
					Against: Enemy
					Types: Human
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
