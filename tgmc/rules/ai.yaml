# Skirmish AI. One bot drives either faction: it only builds what its queues offer, so a marine
# bot trains marines and a xeno bot trains xenos. The map places the starting base; the bot
# then builds generators, tech and turrets, trains units and sends them out in squads. Pattern: OpenRA mods/ra/rules/ai.yaml.
# Xenos are cheap and fast, so the xeno bot gathers a bigger group before it attacks.
Player:
	# Three levels, none of which cheat. Easy has only the basic modules and waits for bigger squads; Normal adds the smart modules (counter-picking,
	# evolving, medics, retreat, CAS); Hard adds scouting and sends smaller squads sooner.
	ModularBot@EasyAI:
		Name: bot-easy-ai.name
		Type: easy
	ModularBot@SkirmishAI:
		Name: bot-skirmish-ai.name
		Type: skirmish
	ModularBot@HardAI:
		Name: bot-hard-ai.name
		Type: hard
	GrantConditionOnBotOwner@skirmish:
		Condition: enable-skirmish-ai
		Bots: easy, skirmish, hard
	GrantConditionOnBotOwner@easy:
		Condition: enable-easy-ai
		Bots: easy
	GrantConditionOnBotOwner@hard:
		Condition: enable-hard-ai
		Bots: hard
	GrantConditionOnFaction@xenos:
		Condition: faction-xenos
		Factions: xenos
	UnitBuilderBotModule@skirmish:
		RequiresCondition: enable-skirmish-ai
		UnitQueues: Infantry, Xeno
		ProductionMinCashRequirement: 60
		UnitsToBuild:
			rifleman: 70
			som_trooper: 70
			som_corpsman: 15
			som_engineer: 15
			som_veteran: 25
			som_squad_leader: 8
			som_field_commander: 4
			medic: 15
			engineer: 15
			smartgunner: 25
			grenadier: 20
			scout: 10
			skirmisher: 12
			trooper: 25
			ranger: 15
			assault: 10
			sniper: 15
			rocketeer: 12
			blademan: 12
			mortarman: 10
			flamer: 18
			machinegunner: 15
			heavygunner: 10
			demolitionist: 8
			mech: 6
			runner: 30
			drone: 14
			hunter: 40
			sentinel: 25
			warrior: 25
			spitter: 25
			praetorian: 15
			crusher: 12
			ravager: 10
			defiler: 8
			boiler: 10
			carrier: 10
			warlock: 8
			shrike: 8
			widow: 8
			wraith: 8
			bull: 8
			behemoth: 4
			queen: 30
		UnitLimits:
			queen: 1
			drone: 4
	# The bot has no builder to walk around, so its cryo pod and silo give it the build area (structures.yaml) and it
	# places each finished structure in a ring around them. It never builds walls. The refinery counts are zeroed
	# because the module otherwise holds back all unit production until it owns a refinery.
	BaseBuilderBotModule@skirmish:
		RequiresCondition: enable-skirmish-ai
		BuildingQueues: MarineBuild, XenoBuild
		# A drone gives the build area too, so weed nodes go up around wherever the weed drones stand (see WeedDroneBotModule).
		ConstructionYardTypes: cryo-pod, resin-silo, forward-hive, drone
		# Defences go toward the nearest enemy, around the base closest to the fighting: the Forward Hive too, so the hive grows toward the enemy.
		DefenseTypes: sentry-turret, resin-turret, mortar-emplacement, artillery-emplacement, resin-trap, cade, forward-hive
		PlaceDefenseTowardsEnemyChance: 100
		InititalMinimumRefineryCount: 0
		AdditionalMinimumRefineryCount: 0
		NewProductionCashThreshold: 0
		MinBaseRadius: 3
		MaxBaseRadius: 14
		ProductionMinCashRequirement: 100
		BuildingFractions:
			miner: 25
			weed-node: 25
			vendor: 8
			cryo-pod: 6
			mini-silo: 8
			armory: 8
			ordnance-depot: 8
			evolution-tower: 8
			maturity-tower: 8
			sentry-turret: 12
			resin-turret: 12
			workshop: 5
			mortar-emplacement: 10
			artillery-emplacement: 6
			forward-hive: 10
			resin-trap: 12
			cade: 10
		BuildingLimits:
			miner: 6
			weed-node: 24
			vendor: 2
			cryo-pod: 4
			mini-silo: 3
			armory: 1
			ordnance-depot: 1
			evolution-tower: 1
			maturity-tower: 1
			sentry-turret: 5
			resin-turret: 5
			workshop: 1
			mortar-emplacement: 4
			artillery-emplacement: 2
			forward-hive: 2
			resin-trap: 6
			cade: 8
		BuildingDelays:
			armory: 1500
			ordnance-depot: 3000
			evolution-tower: 800
			maturity-tower: 2400
			workshop: 3000
			mortar-emplacement: 3500
			artillery-emplacement: 8000
			forward-hive: 4500
			resin-trap: 1500
			cade: 1200
