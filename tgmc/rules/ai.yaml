	# What the enemy is seen to field decides which units the bot asks for on top of its basic mix (it remembers a sighting for a while).
	CounterPickBotModule@marines:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && !faction-xenos
		Counters:
			swarm:
				Enemies: runner, hunter, facehugger, larva, sentinel, warrior
				Units: flamer, machinegunner, grenadier, smartgunner, skirmisher
				Bonus: 150
			heavy:
				Enemies: crusher, praetorian, behemoth, bull, ravager
				Units: rocketeer, demolitionist, heavygunner, mortarman, assault
				Bonus: 150
			ranged:
				Enemies: spitter, boiler, defiler, widow, warlock, shrike, wraith, carrier
				Units: sniper, rifleman, blademan, mech, ranger, scout
				Bonus: 120
	CounterPickBotModule@xenos:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && faction-xenos
		Counters:
			infantry:
				Enemies: rifleman, smartgunner, medic, engineer, blademan, flamer
				Units: runner, hunter, warrior, ravager
				Bonus: 150
			heavy:
				Enemies: mech, heavygunner, demolitionist, rocketeer, grenadier
				Units: crusher, behemoth, bull, boiler, defiler
				Bonus: 150
			guns:
				Enemies: sniper, machinegunner, mortarman, sentry-turret, mortar-emplacement, artillery-emplacement
				Units: runner, hunter, shrike, widow, wraith
				Bonus: 120
	# Xeno units evolve when there is cash to spare. The workers, larvae and the queen stay as they are.
	EvolveBotModule@xenos:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && faction-xenos
		Keep: drone, larva, facehugger, queen
	# Medics go to the wounded and infected, and otherwise stay with the fighting units.
	MedicBotModule@marines:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && !faction-xenos
		Medics: medic
	# Badly wounded units fall back to a refuge and come back when mended.
	RetreatBotModule@marines:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && !faction-xenos
		Refuges: medbay, medic, cryo-pod
		Exclude: medic, engineer
	RetreatBotModule@xenos:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && faction-xenos
		Refuges: weed-node, resin-silo, forward-hive
		Exclude: drone, queen, facehugger, larva
	# On Hard, one cheap fast unit explores the map.
	# Scouting is for every AI above Easy: the big maps need someone to find the enemy.
	ScoutBotModule@marines:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && !faction-xenos
		Scouts: scout, rifleman
	ScoutBotModule@xenos:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && faction-xenos
		Scouts: runner, hunter
	# Drones creep the weeds out across the map: they walk to the edge of the weeds, toward the enemy, and the builder plants nodes around them.
	WeedDroneBotModule@xenos:
		RequiresCondition: enable-skirmish-ai && faction-xenos
		Drones: drone
		Weeds: weeds, weed-node, forward-hive, resin-silo
	# The xeno AI uses its caste abilities: attacks when marines are close, heals and cries when its xenos are hurt or gathered.
	AbilityBotModule@xenos:
		RequiresCondition: enable-skirmish-ai && !enable-easy-ai && faction-xenos
