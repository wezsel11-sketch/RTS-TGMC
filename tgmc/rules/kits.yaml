# Unit ability kits: what each unit can do from the command card's slots (ActiveAbility, tgmc/code/CasteAbilities.cs), after TGMC's
# own kits. Their weapons are in kit-weapons.yaml. Numbers are first guesses, to be tuned in play.

# A leader's three orders (TGMC's issue_order: move, hold, focus): a yell that buffs the marines around him for ten seconds. The buffs
# themselves are on ^Unit (order-move, order-hold, order-focus).
^LeaderOrders:
	ActiveAbility@ordermove:
		OrderName: AbilityOrderMove
		Slot: 1
		Label: Move
		Description: Yell MOVE: marines around you run 25% faster for 10 s.
		Aim: Self
		Cooldown: 900
		AuraRange: 6c0
		AuraCondition: order-move
		AuraDuration: 250
		Shout: MOVE!
		Ring: FFD040
		Sounds: marine-m-warcry-1.ogg, marine-m-warcry-3.ogg, marine-m-warcry-5.ogg, marine-f-warcry-2.ogg
		EffectImage: fx-shockwave
		EffectSequence: ring
		AiRange: 6c0
		AiMinTargets: 2
	ActiveAbility@orderhold:
		OrderName: AbilityOrderHold
		Slot: 2
		Label: Hold
		Description: Yell HOLD: marines around you take 25% less damage for 10 s.
		Aim: Self
		Cooldown: 900
		AuraRange: 6c0
		AuraCondition: order-hold
		AuraDuration: 250
		Shout: HOLD!
		ShoutColor: 60A0FF
		Ring: 60A0FF
		Sounds: marine-m-warcry-7.ogg, marine-m-warcry-9.ogg, marine-f-warcry-4.ogg
		EffectImage: fx-shockwave
		EffectSequence: ring
		AiRange: 5c0
		AiMinTargets: 3
	ActiveAbility@orderfocus:
		OrderName: AbilityOrderFocus
		Slot: 3
		Label: Focus
		Description: Yell FOCUS: marines around you aim better and hit 10% harder for 10 s.
		Aim: Self
		Cooldown: 900
		AuraRange: 6c0
		AuraCondition: order-focus
		AuraDuration: 250
		Shout: FOCUS!
		ShoutColor: FF6040
		Ring: FF6040
		Sounds: marine-m-warcry-11.ogg, marine-m-warcry-13.ogg, marine-f-warcry-6.ogg
		EffectImage: fx-shockwave
		EffectSequence: ring
		AiRange: 8c0
		AiMinTargets: 2

squad_leader:
	Inherits@orders: ^LeaderOrders
	ActiveAbility@ordermove:
		Slot: 4
	ActiveAbility@orderhold:
		Slot: 5
	ActiveAbility@orderfocus:
		Slot: 6

# The field commander's orders carry further than a squad leader's.
field_commander:
	Inherits@orders: ^LeaderOrders
	ActiveAbility@ordermove:
		AuraRange: 9c0
	ActiveAbility@orderhold:
		AuraRange: 9c0
	ActiveAbility@orderfocus:
		AuraRange: 9c0
	ActiveAbility@mark:
		OrderName: AbilityMark
		Slot: 4
		Label: Mark
		Description: Ping the nearest enemy within 12 cells so the squad can see it.
		Aim: Nearest
		Range: 12c0
		Weapon: TGMCMarkTarget
		Cooldown: 1800

