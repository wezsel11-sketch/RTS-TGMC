# The mech (TGMC's greyscale mech and its modules): boost, armour burst, cloak, shield, leg overload, smoke and the rocket pod.
mech:
	ActiveAbility@overboost:
		OrderName: AbilityOverboost
		Slot: 1
		Label: Boost
		Description: Overboost: dash 4 cells toward where you click.
		Aim: Target
		Range: 4c0
		ChargeDistance: 4c0
		ChargeTicks: 10
		Cooldown: 450
		Sounds: overboost.ogg
		EffectImage: fx-spark
		EffectSequence: idle
		AiRange: 0c0
	ActiveAbility@assaultarmor:
		OrderName: AbilityAssaultArmor
		Slot: 2
		Label: Assault
		Description: Assault Armor: a burst of energy that hurts every enemy within 2.5 cells.
		Aim: Self
		Weapon: TGMCAssaultArmor
		Cooldown: 900
		Ring: 80C0FF
		Sounds: lightning-charge.ogg
		AiRange: 2c512
		AiMinTargets: 2
	ActiveAbility@cloak:
		OrderName: AbilityMechCloak
		Slot: 3
		Label: Cloak
		Description: Turn nearly invisible until you fire or switch it off.
		Toggle: true
		Condition: mech-cloak
		Cooldown: 250
		Sounds: cloak-on.ogg
	Cloak@ability:
		RequiresCondition: mech-cloak
		InitialDelay: 0
		CloakDelay: 50
		UncloakOn: Attack
		CloakSound: cloak-on.ogg
		UncloakSound: cloak-off.ogg
		CloakedAlpha: 0.25
	ActiveAbility@pulsearmor:
		OrderName: AbilityPulseArmor
		Slot: 4
		Label: Shield
		Description: Pulse Armor: take 70% less damage for 3 s.
		Aim: Self
		Condition: pulse-armor
		Duration: 75
		Cooldown: 750
		Sounds: shield-up.ogg
		AiRange: 6c0
		AiMinTargets: 3
	DamageMultiplier@pulsearmor:
		RequiresCondition: pulse-armor
		Modifier: 30
	WithColoredOverlay@pulsearmor:
		RequiresCondition: pulse-armor
		Color: 604080FF
	ActiveAbility@overload:
		OrderName: AbilityLegOverload
		Slot: 5
		Label: Overload
		Description: Overload the legs: 40% faster, but the mech slowly breaks itself. Press again to stop.
		Toggle: true
		Condition: leg-overload
		Cooldown: 50
		Sounds: overload-start.ogg
	SpeedMultiplier@overload:
		RequiresCondition: leg-overload
		Modifier: 140
	ChangesHealth@overload:
		RequiresCondition: leg-overload
		PercentageStep: -1
		Delay: 25
	StatusLabel@overload:
		RequiresCondition: leg-overload
		Text: OVERLOAD
		Color: FF4040
		Height: 1700
	ActiveAbility@smoke:
		OrderName: AbilityMechSmoke
		Slot: 6
		Label: Smoke
		Description: Pop a smoke screen around the mech.
		Aim: Self
		Weapon: TGMCSmokeScreen
		Spawn: smoke-shell-cloud
		Cooldown: 1200
		Sounds: smoke-bomb.ogg
		AiRange: 6c0
		AiMinTargets: 4
	ActiveAbility@barrage:
		OrderName: AbilityBarrage
		Slot: 7
		Label: Barrage
		Description: Empty the rocket pod on the spot you click.
		Aim: Target
		Range: 10c0
		Launch: true
		Weapon: TGMCMechBarrage
		Cooldown: 900
		AiRange: 10c0
		AiMinTargets: 3

# A smoke cloud from a shell, rocket or grenade: it hangs for about 16 seconds.
smoke-shell-cloud:
	Inherits: smoke-screen
	KillsSelf:
		Delay: 400

# A flare's light: it shows the ground around it for 12 seconds.
flare-light:
	Inherits: sensor-ping
	Expires:
		Ticks: 300
	RevealsShroud:
		Range: 8c0
	-DetectCloaked:

