# SOM rockets: HEAT, thermobaric and radiation instead of the SADAR's AP, white phosphorus and smoke.
som_rocketeer:
	Armament@AP:
		Weapon: TGMCSomThermobaric
	Armament@WP:
		Weapon: TGMCSomRadiation
	-Armament@SMOKE:
	-ActiveAbility@smoke:
	ActiveAbility@ap:
		Label: Thermo
		Description: Load thermobaric rockets: a wide, burning blast.
	ActiveAbility@wp:
		Label: Rad
		Description: Load radiation rockets: a sickening cloud that slows and hurts.
