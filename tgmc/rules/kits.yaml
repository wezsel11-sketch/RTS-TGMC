		Range: 4c0
		ChargeDistance: 4c0
		ChargeTicks: 8
		Weapon: TGMCLunge
		Cooldown: 400
		Sounds: slam-1.ogg, slam-2.ogg
		EffectImage: fx-dirt-puff
		EffectSequence: idle
