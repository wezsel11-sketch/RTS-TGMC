		Cooldown: 750
		Sounds: reload-mg.ogg
		AiRange: 7c0
		AiMinTargets: 3
	ReloadDelayMultiplier@overdrive:
		RequiresCondition: overdrive
		Modifier: 60
	StatusLabel@overdrive:
		RequiresCondition: overdrive
		Text: OVERDRIVE
		Color: FF8040
		Height: 1250

# Deployed on its bipod: it hardly walks, but it reaches further and fires faster.
^DeployGun:
	ActiveAbility@deploy:
		OrderName: AbilityDeploy
		Slot: 1
		Label: Deploy
		Description: Set up the gun: slower, but more reach and faster fire. Press again to pack it up.
		Toggle: true
		Condition: deployed
		Cooldown: 50
		Sounds: reload-mg.ogg
	SpeedMultiplier@deployed:
		RequiresCondition: deployed
		Modifier: 25
	RangeMultiplier@deployed:
		RequiresCondition: deployed
		Modifier: 125
	ReloadDelayMultiplier@deployed:
		RequiresCondition: deployed
		Modifier: 75
	StatusLabel@deployed:
		RequiresCondition: deployed
		Text: DEPLOYED
		Color: C0C0C0
		Height: 1250

machinegunner:
	Inherits@deploy: ^DeployGun

heavygunner:
	Inherits@deploy: ^DeployGun

flamer:
	ActiveAbility@firewall:
		OrderName: AbilityFireWall
		Slot: 1
		Label: Fire wall
		Description: Set a wide patch of ground on fire where you click.
		Aim: Target
		Range: 5c0
		Weapon: TGMCFireWall
		Cooldown: 750
		AiRange: 5c0
		AiMinTargets: 3

