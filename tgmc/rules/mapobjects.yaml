# Objects that stand on the converted TGMC maps and can be shot to pieces: tables, barricades, windows, vending machines and so on. The actors
# mapobj-<n> (one per picture, with its hit points and whether it blocks) are written by mod/build_maptiles.py after this file when the mod is built.
# They belong to the Neutral player: explosions and force-fire (Ctrl) destroy them, and a blocking one that falls opens the way.

^MapObject:
	Tooltip:
		Name: actor-mapobject.name
	Health:
		HP: 100
	Targetable:
		TargetTypes: Ground, Structure, MapObject
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	RenderSprites:
		Image: mapobj
	FrozenUnderFog:
	FireWarheadsOnDeath:
		Weapon: TGMCObjectBreak
		EmptyWeapon: TGMCObjectBreak
	Interactable:
	BodyOrientation:
		QuantizedFacings: 1

^MapObjectBlocking:
	Inherits: ^MapObject
	Building:
		Footprint: x
		Dimensions: 1, 1
		TerrainTypes: Clear, Road

# A blocking object that also stops bullets (barricades, closets, crates, windows): a CoverBullet hits it instead of what is behind it.
^MapObjectCover:
	Inherits: ^MapObjectBlocking
	BlocksBullets:

# A door: opens by itself with TGMC's animation when a unit comes near (MapDoor, see tgmc/code/MapDoor.cs). The sequences come from build_maptiles.py.
^MapDoor:
	Inherits: ^MapObjectCover

^MapObjectOpen:
	Inherits: ^MapObject
	# Units walk over it, as over weeds.
	Building:
		Footprint: =
		Dimensions: 1, 1

# An ore field: TGMC's ore drill, the one thing on a converted map a player can take. It starts broken and belongs to no one
# (MinerField in tgmc/code/MinerField.cs). A marine engineer repairs it with the torch; once it is back to full health it becomes
# that player's miner. It shows on the radar and stays on the map under fog, so every field is marked for both sides.
# Placed by mod/build_maptiles.py on each TGMC map that has drills (the sprite is drawn by mod/make_placeholders.py).
miner-field:
	Tooltip:
		Name: actor-miner-field.name
	Health:
		HP: 500
	Building:
		Footprint: =
		Dimensions: 1, 1
		TerrainTypes: Clear, Road
	RenderSprites:
	WithSpriteBody:
	WithIdleAnimation:
		Sequences: idle
	Targetable:
		TargetTypes: Ground, Structure, Repair
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Selectable:
		Bounds: 32, 32
	BodyOrientation:
		QuantizedFacings: 1
	AppearsOnRadar:
	FrozenUnderFog:
	MinerField:
		IntoActor: miner

# The Alamo, the dropship that lands for the Evac mission (mod/scenarios/mission-evac.lua): 11 by 21 cells, drawn from TGMC's own
# layout with its side hatches, rear ramp and cockpit hatch (mod/build_sprites.py compose_alamo). Units walk onto it; the mission
# script boards every marine that steps on. The doors follow the conditions the script grants (doors-opening, then doors-open; doors-
# closing on take-off). Deploy (F) on the selected ship launches it early: the launch condition removes it, which the script reads.
alamo:
	ScriptTriggers:
	Tooltip:
		Name: actor-alamo.name
	Selectable:
		Bounds: 11264, 21504
		Priority: 10
	SelectionDecorations:
	Immobile:
		OccupiesSpace: false
	# The landing lights up the zone: the player sees the ship and what comes for it.
	RevealsShroud:
		Range: 14c0
		Type: CenterPosition
	RenderSprites:
		Image: alamo
		Palette: effect
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	WithIdleOverlay@closed:
		Sequence: doors-closed
		Palette: effect
		RequiresCondition: !doors-opening && !doors-open && !doors-closing
	WithIdleOverlay@opening:
		Sequence: doors-opening
		Palette: effect
		RequiresCondition: doors-opening
	WithIdleOverlay@open:
		Sequence: doors-open
		Palette: effect
		RequiresCondition: doors-open && !doors-closing
	WithIdleOverlay@closing:
		Sequence: doors-closing
		Palette: effect
		RequiresCondition: doors-closing
	ExternalCondition@opening:
		Condition: doors-opening
	ExternalCondition@open:
		Condition: doors-open
	ExternalCondition@closing:
		Condition: doors-closing
	ExternalCondition@launch:
		Condition: launch
	GrantConditionOnDeploy:
		DeployedCondition: launch
		DeployCursor: ability
		DeployBlockedCursor: move-blocked
	# Flies in when the mission calls it, and on launch climbs away and is gone (Dropship in Dropship.cs).
	Dropship:
		RequiresCondition: launch
