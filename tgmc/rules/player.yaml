^BasePlayer:
	Shroud:
	FrozenActorLayer:

Player:
	Inherits: ^BasePlayer
	PlayerResources:
		SelectableCash: 500, 1000, 2500, 5000
		DefaultCash: 1000
	PlayerRadarTerrain:
	# Faction prerequisites: the marines' units and the SOM's units each show only for their own faction (~ hides what is not available).
	ProvidesPrerequisite@marines:
		Prerequisite: faction-marines
		Factions: marines
	ProvidesPrerequisite@som:
		Prerequisite: faction-som
		Factions: som
	# The xenos' upgrades hide from the other factions the same way (~faction-xenos).
	ProvidesPrerequisite@xenos:
		Prerequisite: faction-xenos
		Factions: xenos
	# The Upgrades tab (UpgradeQueue in tgmc/code/ProductionQueues.cs, the upgrades in tgmc/rules/upgrades.yaml). Units switch on an upgrade with
	# GrantConditionOnPrerequisite, which needs the manager below. It sits before the unit queues on purpose: queues are paid in this order each tick,
	# and an upgrade takes only a cash a tick, so ahead of the units it still gets paid when they would drain the bank.
	GrantConditionOnPrerequisiteManager:
	UpgradeQueue@Upgrade:
		Type: Upgrade
		Group: Upgrade
		BuildDurationModifier: 100
		Factions: marines, som, xenos
		DisplayOrder: 5
		ReadyAudio: UnitReady
		QueuedAudio: Training
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	# One unit per production building is built at the same time (MultiProductionQueue in tgmc/code/ProductionQueues.cs).
	MultiProductionQueue@Infantry:
		Type: Infantry
		BuildDurationModifier: 280
		Factions: marines, som
		DisplayOrder: 1
		ReadyAudio: UnitReady
		QueuedAudio: Training
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	MultiProductionQueue@Xeno:
		Type: Xeno
		BuildDurationModifier: 200
		Factions: xenos
		DisplayOrder: 2
		ReadyAudio: UnitReady
		QueuedAudio: Training
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	# The marines' own queue for defences. The base builder never uses it, so a defence ordered for a miner (FieldDefenseBotModule) does not wait
	# behind the base's buildings. Cades and sentries can be built from either queue.
	ClassicProductionQueue@MarineDefense:
		Type: MarineDefense
		Group: Build
		BuildDurationModifier: 110
		Factions: marines, som
		DisplayOrder: 4
		ReadyAudio: UnitReady
		QueuedAudio: Training
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ClassicProductionQueue@MarineBuild:
		Type: MarineBuild
		Group: Build
		BuildDurationModifier: 110
		Factions: marines, som
		DisplayOrder: 3
		ReadyAudio: UnitReady
		QueuedAudio: Training
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ClassicProductionQueue@XenoBuild:
		Type: XenoBuild
		Group: Build
		BuildDurationModifier: 110
		Factions: xenos
		DisplayOrder: 3
		ReadyAudio: UnitReady
		QueuedAudio: Training
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	SupportPowerManager:
	PlaceBuilding:
		CannotPlaceNotification: NoBuild
	DeveloperMode:
	TechTree:
	ScriptTriggers:
	MissionObjectives:
		WinNotification: Win
		LoseNotification: Lose
		LeaveNotification: Leave
	DamageNotifier:
		ValidTargets: Structure
		Notification: BaseAttack
		NotifyInterval: 20000
	PlayerStatistics:
	ConquestVictoryConditions:
