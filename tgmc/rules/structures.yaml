# ---------------------------------------------------------------- marines

miner:
	# A raided miner warns its owner with its own message and a red ping, apart from the general under-attack alert.
	AlertOnDamage:
		Event: event-miner-under-attack
		PingColor: FF3030
	Inherits: ^Structure
	Inherits@build: ^MarineBuildable
	-AppearsOnRadar:
	# On the minimap a capture point is a diamond in its holder's colour (grey while free), larger on platinum.
	PointRadarSignature:
		RequiresCondition: !platinum
	PointRadarSignature@platinum:
		Radius: 2
		RequiresCondition: platinum
	# A capture point: a miner stands only on an ore field, claimed by repairing the field (MinerField). It is not on the build list.
	AmbientSound:
		SoundFiles: amb-hum.ogg
	Health:
		HP: 250
	# A miner can never be destroyed, so it must not count toward conquest: a clamped miner would keep its owner alive forever.
	-MustBeDestroyed:
	# Xenos can disable a miner but never destroy it: it stays at 25% until a marine repairs it (see MinerField in tgmc/code/MinerField.cs).
	MinerField:
		DisabledCondition: miner-disabled
		FieldActor: miner-field
	Tooltip:
		Name: actor-miner.name
	# On a platinum vein (mapobjects.yaml): half as much again.
	ExternalCondition@platinum:
		Condition: platinum
	WithColoredOverlay@platinum:
		Color: C8E6FF50
		RequiresCondition: platinum
	CashTrickler@platinum:
		Interval: 50
		Amount: 5
		ShowTicks: false
		RequiresCondition: platinum && !miner-disabled
	Valued:
		Cost: 150
	WithIdleAnimation:
		Sequences: idle
	CashTrickler:
		Interval: 50
		Amount: 10
		# A disabled miner (at its floor, see MinerField) pays nothing until a marine repairs it.
		RequiresCondition: !miner-disabled
	# Deep-core drills (upgrades.yaml): half as much again, silently (the main trickle already shows the payout).
	GrantConditionOnPrerequisite@drills:
		Condition: miner-drills
		Prerequisites: upgrade-miner-drills
	CashTrickler@drills:
		Interval: 50
		Amount: 5
		ShowTicks: false
		RequiresCondition: miner-drills && !miner-disabled
	# Reinforced housings (upgrades.yaml): a third less damage, so it takes the xenos longer to disable the miner.
	GrantConditionOnPrerequisite@housing:
		Condition: miner-housing
		Prerequisites: upgrade-miner-housing
	DamageMultiplier@housing:
		RequiresCondition: miner-housing
		Modifier: 67

# The xenos' miner: an ore field a drone has corrupted with resin (MinerField's FactionIntoActors in mapobjects.yaml). It pays the hive
# biomass on top of its own income, less than a marine miner pays. Knocked down to its floor it is a free field again.
corrupted-miner:
	AlertOnDamage:
		Event: event-miner-under-attack
		PingColor: FF3030
	Inherits: ^Structure
	-AppearsOnRadar:
	# On the minimap a capture point is a diamond in its holder's colour (grey while free), larger on platinum.
	PointRadarSignature:
