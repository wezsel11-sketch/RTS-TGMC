# Resin door (TGMC's /obj/structure/mineral_door/resin): xenos and their allies walk through, it opens for them and closes ten
# seconds after the last one has gone; marines have to break it down. With resin walls it lets the hive wall itself in.
resin-door:
	# Hardened resin (upgrades.yaml): a third less damage taken.
	GrantConditionOnPrerequisite@hardened:
		Condition: hardened
		Prerequisites: upgrade-hardened-resin
	DamageMultiplier@hardened:
		RequiresCondition: hardened
		Modifier: 67
	Inherits: ^Structure
	Inherits@build: ^XenoMinorBuildable
	Buildable:
		Queue: XenoBuild
		BuildPaletteOrder: 21
		Description: actor-resin-door.description
	TgmcVoiced:
		VoiceSet: XenoStructureVoice
	Tooltip:
		Name: actor-resin-door.name
	-MustBeDestroyed:
	-AppearsOnRadar:
	-ProvidesPrerequisite@buildingname:
	Health:
		HP: 250
	Valued:
		Cost: 40
	RevealsShroud:
		Range: 3c0
	# A resin wall can end on a door when a line of them is dragged.
	LineBuildNode:
		Types: wall
	BlocksBullets:
	-WithSpriteBody:
	WithSpriteBody@closed:
		Name: closed
		RequiresCondition: !door-open
		Sequence: resin-closed
	WithSpriteBody@open:
		Name: open
		RequiresCondition: door-open && !door-sideways
		Sequence: resin-open
	WithSpriteBody@hopen:
		Name: hopen
		RequiresCondition: door-open && door-sideways
		Sequence: hresin-open
	# Counts as a neighbour for the resin walls beside it.
	WeedEdges:
		Group: resin
		Prefix:
	MapDoor:
		Prefix: resin
		FriendsOnly: true
		CloseDelay: 250
		Walls: resin-wall, resin-door
		SidewaysCondition: door-sideways
		OpenSound: resin-build.ogg
		CloseSound: resin-build.ogg

