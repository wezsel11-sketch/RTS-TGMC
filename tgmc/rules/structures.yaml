# Xeno structures. Sprites come from mod/build_sprites.py (resin-turret, resin-silo, mini-silo).

^Structure:
	Health:
		HP: 600
	Building:
		Footprint: x
		Dimensions: 1, 1
		TerrainTypes: Clear, Road
	RevealsShroud:
		Range: 8c0
	FrozenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ProvidesPrerequisite@buildingname:
	Voiced:
		VoiceSet: MarineStructureVoice
	DeathSounds:
	Selectable:
		Bounds: 512, 512, -256, -256
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Structure
	Targetable@REPAIR:
		RequiresCondition: damaged
		TargetTypes: Repair
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: idle
	WithSpriteBody:
	Valued:
		Cost: 200

resin-turret:
	Inherits: ^Structure
	Voiced:
		VoiceSet: XenoStructureVoice
	Health:
		HP: 400
	Tooltip:
		Name: actor-resin-turret.name
	Valued:
		Cost: 300
	WithSpriteBody:
		Sequence: turret
	QuantizeFacingsFromSequence:
		Sequence: turret
	Turreted:
		TurnSpeed: 20
	Armament@PRIMARY:
		Weapon: TGMCAcid
		Turret: primary
	AttackTurreted:
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground

resin-silo:
	Inherits: ^Structure
	Voiced:
		VoiceSet: XenoStructureVoice
	ProvidesRadar:
	Building:
		Footprint: xxx xxx xxx
		Dimensions: 3, 3
	Selectable:
		Bounds: 2560, 2560, -1280, -1280
	HitShape:
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536
	StoresPlayerResources:
		Capacity: 1000
	Tooltip:
		Name: actor-resin-silo.name
	Valued:
		Cost: 400
	WithIdleAnimation:
		Sequences: idle
	CashTrickler:
		Interval: 50
		Amount: 15
	Exit@1:
		SpawnOffset: 0,1024,0
		ExitCell: 1,3
	RallyPoint:
		Path: 1, 6
	Production:
		Produces: Xeno
	ProductionBar:
		ProductionType: Xeno

mini-silo:
	Inherits: ^Structure
	Voiced:
		VoiceSet: XenoStructureVoice
	Building:
		Footprint: xx xx
		Dimensions: 2, 2
	StoresPlayerResources:
		Capacity: 300
	Exit@1:
		SpawnOffset: 0,512,0
		ExitCell: 0,2
	RallyPoint:
		Path: 0, 5
	Production:
		Produces: Xeno
	ProductionBar:
		ProductionType: Xeno
	Tooltip:
		Name: actor-mini-silo.name
	Valued:
		Cost: 150
	WithIdleAnimation:
		Sequences: idle
	CashTrickler:
		Interval: 50
		Amount: 5

sentry-turret:
	Inherits: ^Structure
	Health:
		HP: 300
	Building:
		Footprint: x
		Dimensions: 1, 1
	Tooltip:
		Name: actor-sentry-turret.name
	Valued:
		Cost: 250
	WithSpriteBody:
		Sequence: turret
	QuantizeFacingsFromSequence:
		Sequence: turret
	Turreted:
		TurnSpeed: 20
	Armament@PRIMARY:
		Weapon: TGMCSentry
		Turret: primary
	AttackTurreted:
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground

cryo-pod:
	Inherits: ^Structure
	AmbientSound:
		SoundFiles: amb-generator.ogg
	ProvidesRadar:
	Building:
		Footprint: x x
		Dimensions: 1, 2
	Health:
		HP: 250
	WithIdleAnimation:
		Sequences: active
	Exit@1:
		SpawnOffset: 0,512,0
		ExitCell: 0,2
	RallyPoint:
		Path: 0, 5
	Production:
		Produces: Infantry
	ProductionBar:
		ProductionType: Infantry
	Tooltip:
		Name: actor-cryo-pod.name
	Valued:
		Cost: 300

vendor:
