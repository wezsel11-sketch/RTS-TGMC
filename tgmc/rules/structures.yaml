# Heaps of broken blocks left where a structure died. They fade away after a while.
^Rubble:
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Image: rubble
		Palette: player
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	HiddenUnderFog:
		Type: CenterPosition
	KillsSelf:
		Delay: 1500
		RemoveInstead: true

rubble-small:
	Inherits: ^Rubble
	WithSpriteBody:
		Sequence: small

rubble-medium:
	Inherits: ^Rubble
	WithSpriteBody:
		Sequence: medium

rubble-large:
	Inherits: ^Rubble
	WithSpriteBody:
		Sequence: large

# The light a Flare leaves on the ground: it reveals the fog round it for the marines that fired it, until the power removes it.
flare:
	Interactable:
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Palette: effect
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
		Sequence: idle
	RevealsShroud:
		Range: 13c0
		Type: CenterPosition
	HiddenUnderFog:
		Type: CenterPosition
