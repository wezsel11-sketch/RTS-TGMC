	# Resin grown over the drill: strands drawn on top (mod/make_placeholders.py), and a faint purple cast.
	WithIdleOverlay@resin:
		Image: resin-strands
		Sequence: idle
	WithColoredOverlay:
		Color: 9A40C038
	Health:
		HP: 250
	-MustBeDestroyed:
	MinerField:
		FieldActor: miner-field
	Tooltip:
		Name: actor-corrupted-miner.name
	ExternalCondition@platinum:
		Condition: platinum
	CashTrickler@platinum:
		Interval: 50
		Amount: 3
		ShowTicks: false
		RequiresCondition: platinum
	Valued:
		Cost: 150
	WithIdleAnimation:
		Sequences: idle
	CashTrickler:
		Interval: 50
		Amount: 7
	# Fed by weeds: with weeds on a cell beside it, it pays 4 more (11 in all). Marines starve it by burning the weeds off.
	OnWeedsCondition:
	CashTrickler@weeds:
