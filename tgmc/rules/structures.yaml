weed-node:
	# Outlying weeds warn the hive when raided (a ping and an event), like a marine miner does.
	AlertOnDamage:
		Event: event-outpost-under-attack
		PingColor: C040FF
	# Resin glows a faint purple at night (the lobby's Night option).
	NightLight:
		Range: 3c0
		Intensity: 0.4
		RedTint: 0.75
		GreenTint: 0.35
		BlueTint: 1
	Inherits: ^Structure
	Inherits@build: ^XenoMinorBuildable
	Buildable:
		Queue: XenoBuild
		BuildPaletteOrder: 10
		Description: actor-weed-node.description
	TgmcVoiced:
		VoiceSet: XenoStructureVoice
	Health:
		HP: 160
	Tooltip:
		Name: actor-weed-node.name
	# Weeds are territory, not money: a node is cheap, pays nothing and has no limit. The hive's income is its own trickle and the
	# ore fields its drones corrupt (corrupted-miner).
	Valued:
		Cost: 40
	WithIdleAnimation:
		Sequences: idle
	# Marines destroy a weed sack in melee: it is not a Ground or Structure target, so no gun shoots it, only the rifle butt (TGMCButt) hits it,
	# on its own or when the marine bot sends a unit (see FieldBotModule@sweep in ai.yaml).
	Targetable:
		TargetTypes: WeedNode
	# Creeps out on its own, so xenos do not have to place weeds one by one.
	# Creeping Weeds (upgrades.yaml): SpreadWeeds reads this flag and grows faster.
	GrantConditionOnPrerequisite@fastweeds:
		Condition: fast-weeds
		Prerequisites: upgrade-fast-weeds
	UpgradeFlag@fastweeds:
		Flag: fast-weeds
		RequiresCondition: fast-weeds
	SpreadWeeds:
		MaxRadius: 5
		Interval: 60
	# The node sits on a cell of carpet with the same ragged edge as the weeds around it.
	WeedEdges:
		Image: weeds
	# Territory: 4 living nodes open the tier 3 castes, 8 the tier 4 ones (WeedNodeTech in tgmc/code/Weeds.cs).
	WeedNodeTech:

weeds:
	Inherits: weed-node
	# The carpet's edge is ragged where no weed lies beyond it (see WeedEdges). Here the carpet is the body itself.
	-WithIdleAnimation:
	-SpreadWeeds:
	-MustBeDestroyed:
	-WeedNodeTech:
	-GrantConditionOnPrerequisite@fastweeds:
	-UpgradeFlag@fastweeds:
	-AppearsOnRadar:
	RevealsShroud:
		Type: CenterPosition
	# Walkable carpet: units pass over it but it still marks the cell as taken and extends the build area. It cannot be clicked, so a click on a
	# xeno standing on it selects the xeno, not the carpet.
	-Selectable:
	-SelectionDecorations:
	-SelectionRing:
	Interactable:
	Building:
		Footprint: =
	Buildable:
		BuildPaletteOrder: 11
		BuildLimit: 0
		Description: actor-weeds.description
	Health:
		HP: 80
	Tooltip:
		Name: actor-weeds.name
	Valued:
		Cost: 15
	GivesBuildableArea:
		AreaTypes: xeno-minor
	# Marines do not shoot the carpet: it dies with the node that grew it. (Not Ground or Structure, so no weapon picks it.)
	# Fire is the exception: a burning patch of ground kills the weeds under it (BurnsWeeds on flame-patch), until the node grows them back.
	Targetable:
		TargetTypes: Weeds
	# Sticky weeds (upgrades.yaml): marines standing on these are slowed (OnWeedsCondition@sticky on ^Infantry looks for this type).
	GrantConditionOnPrerequisite@sticky:
		Condition: sticky-weeds
		Prerequisites: upgrade-sticky-weeds
	Targetable@sticky:
		TargetTypes: StickyWeeds
		RequiresCondition: sticky-weeds

