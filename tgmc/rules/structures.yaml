# Structures. Sprites come from mod/build_sprites.py. Every structure is built from the sidebar's Build tab (the
# MarineBuild and XenoBuild queues in player.yaml) and may only be placed within Adjacent cells of a builder unit that
# gives the matching area type: engineers for marines, drones for minor xeno structures, the queen for any of them.
# Maps pre-place the starting base. The skirmish AI has no builder to walk, so its cryo pod and silo give the area too.

^Structure:
	FadesInOnBuild:
	Health:
		HP: 600
	Building:
		Footprint: x
		Dimensions: 1, 1
		TerrainTypes: Clear, Road
	# Ghost of the building under the cursor: green footprint where it fits, red where it does not.
	ActorPreviewPlaceBuildingPreview:
	RevealsShroud:
		Range: 8c0
	FrozenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ProvidesPrerequisite@buildingname:
	# Smoke drifts off a building once it is badly hurt.
	WithDamageOverlay:
		Image: fx-smoke
		LoopSequence: loop
		Palette: effect
		Offset: 0, 0, 400
	Voiced:
		VoiceSet: MarineStructureVoice
	DeathSounds:
	# Any building keeps the minimap running, so the radar panel is never blank while you have a base.
	ProvidesRadar:
	Selectable:
		Bounds: 512, 512, -256, -256
	SelectionDecorations:
	SelectionRing:
		Radius: 720
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Structure
	Targetable@REPAIR:
		RequiresCondition: damaged
		TargetTypes: Repair
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: idle
	WithSpriteBody:
	Valued:
		Cost: 200

# Where a structure may be placed: within Adjacent cells of an actor with GivesBuildableArea of the same type.
# Marines build almost anywhere: 24 cells from any marine structure or Engineer.
^MarineBuildable:
	RequiresBuildableArea:
		AreaTypes: marine-build
		Adjacent: 24

^XenoMinorBuildable:
	RequiresBuildableArea:
		AreaTypes: xeno-minor
		Adjacent: 5

^XenoMajorBuildable:
	RequiresBuildableArea:
		AreaTypes: xeno-major
		Adjacent: 5

# Walls: cheap, sturdy, not needed to win, and dragged out in a line (place one end, then the other).
^Wall:
	Inherits: ^Structure
	Health:
		HP: 350
	-MustBeDestroyed:
	-AppearsOnRadar:
	-ProvidesPrerequisite@buildingname:
	RevealsShroud:
		Range: 3c0
	LineBuild:
		Range: 5
		NodeTypes: wall
	LineBuildNode:
		Types: wall
	Valued:
		Cost: 20

