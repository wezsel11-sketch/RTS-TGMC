# Structures. Sprites come from mod/build_sprites.py. Every structure is built from the sidebar's Build tab (the
# MarineBuild and XenoBuild queues in player.yaml) and may only be placed within Adjacent cells of a builder unit that
# gives the matching area type: engineers for marines, drones for minor xeno structures, the queen for any of them.
# Maps pre-place the starting base. The skirmish AI has no builder to walk, so its cryo pod and silo give the area too.

^Structure:
	Health:
		HP: 600
	Building:
		Footprint: x
		Dimensions: 1, 1
		TerrainTypes: Clear, Road
	RevealsShroud:
		Range: 8c0
	FrozenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ProvidesPrerequisite@buildingname:
	Voiced:
		VoiceSet: MarineStructureVoice
	DeathSounds:
	Selectable:
		Bounds: 512, 512, -256, -256
	SelectionDecorations:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Structure
	Targetable@REPAIR:
		RequiresCondition: damaged
		TargetTypes: Repair
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: idle
	WithSpriteBody:
	# Damage you can see (an overlay plays on a hit and carries on while the structure stays that damaged): smoke from half health, flames and a heavier plume from a quarter, a blast and a heap of rubble at death
	WithDamageOverlay@SMOKE:
		Image: fx-smoke
		LoopSequence: small
		LoopCount: 5000
		MinimumDamageState: Heavy
		MaximumDamageState: Heavy
		Offset: 0, 0, 200
	WithDamageOverlay@PLUME:
		Image: fx-smoke
		LoopSequence: big
		LoopCount: 5000
		MinimumDamageState: Critical
		Offset: 120, -100, 400
	WithDamageOverlay@FIRE:
		Image: fx-fire
		LoopSequence: flame
		LoopCount: 5000
		MinimumDamageState: Critical
		Offset: -150, 120, 0
	FireWarheadsOnDeath:
		Weapon: TGMCBlastSmall
		EmptyWeapon: TGMCBlastSmall
	SpawnActorOnDeath:
		Actor: rubble-small
	WithIdleOverlay@TEAM:
		Image: team
		Sequence: plate-32x32
		Palette: player
		IsPlayerPalette: true
	Valued:
		Cost: 200

# Where a structure may be placed: within Adjacent cells of an actor with GivesBuildableArea of the same type.
^MarineBuildable:
	RequiresBuildableArea:
		AreaTypes: marine-build
		Adjacent: 5

^XenoMinorBuildable:
	RequiresBuildableArea:
		AreaTypes: xeno-minor
		Adjacent: 5

^XenoMajorBuildable:
	RequiresBuildableArea:
		AreaTypes: xeno-major
		Adjacent: 5

# Walls: cheap, sturdy, not needed to win, and dragged out in a line (place one end, then the other).
^Wall:
	Inherits: ^Structure
	Health:
		HP: 350
	-MustBeDestroyed:
	-AppearsOnRadar:
	-ProvidesPrerequisite@buildingname:
	-WithIdleOverlay@TEAM:
	-FireWarheadsOnDeath:
	-WithDamageOverlay@PLUME:
	-WithDamageOverlay@FIRE:
	RevealsShroud:
		Range: 3c0
	LineBuild:
		Range: 5
		NodeTypes: wall
	LineBuildNode:
		Types: wall
	Valued:
		Cost: 20

