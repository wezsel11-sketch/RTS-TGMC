# Structures. Sprites come from mod/build_sprites.py. Every structure is built from the sidebar's Build tab (the
# MarineBuild and XenoBuild queues in player.yaml) and may only be placed within Adjacent cells of a builder unit that
# gives the matching area type: engineers for marines, drones for minor xeno structures, the queen for any of them.
# Maps pre-place the starting base. The skirmish AI has no builder to walk, so its cryo pod and silo give the area too.

^Structure:
	# Tells the owner's ThreatMemory who hit it.
	ReportsThreatOnDamage:
	FadesInOnBuild:
	# Kills so far (turrets), shown on the selection card.
	KillCount:
	Health:
		HP: 600
	Building:
		Footprint: x
		Dimensions: 1, 1
		TerrainTypes: Clear, Road
	# Ghost of the building under the cursor: green footprint where it fits, red where it does not.
	ActorPreviewPlaceBuildingPreview:
	RevealsShroud:
		Range: 8c0
	FrozenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ProvidesPrerequisite@buildingname:
	# Smoke drifts off a building once it is badly hurt.
	WithDamageOverlay:
		Image: fx-smoke
		LoopSequence: loop
		Palette: effect
		Offset: 0, 0, 400
	TgmcVoiced:
		VoiceSet: MarineStructureVoice
	DeathSounds:
	# Any building keeps the minimap running, so the radar panel is never blank while you have a base.
	ProvidesRadar:
	Selectable:
		Bounds: 512, 512, 0, 0
	SelectionDecorations:
	SelectionRing:
		Radius: 720
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Structure
	Targetable@REPAIR:
		RequiresCondition: damaged
		TargetTypes: Repair
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: idle
	WithSpriteBody:
	Valued:
		Cost: 200

# Where a structure may be placed: within Adjacent cells of an actor with GivesBuildableArea of the same type.
# Marines build almost anywhere: 24 cells from any marine structure (an engineer's area is no longer needed).
^MarineBuildable:
	# Base lamps at night (the lobby's Night option): a wide cool-white pool around every marine and SOM structure except cades.
	NightLight:
		Range: 5c0
		Intensity: 0.7
		RedTint: 0.95
		GreenTint: 1
		BlueTint: 1.05
	RequiresBuildableArea:
		AreaTypes: marine-build
		Adjacent: 24
	# Every marine structure gives the build area itself, so marines (and the SOM) build without an engineer: 24 cells from any of their structures.
	GivesBuildableArea@self:
		AreaTypes: marine-build
	# Every marine structure is a builder too, so the build menu works without an engineer (marines and SOM alike).
	Production@build:
		Produces: MarineBuild, MarineDefense

^XenoMinorBuildable:
	RequiresBuildableArea:
		AreaTypes: xeno-minor
		Adjacent: 5

^XenoMajorBuildable:
	# Resin glows a faint purple at night (the lobby's Night option).
	NightLight:
		Range: 3c0
		Intensity: 0.4
		RedTint: 0.75
		GreenTint: 0.35
		BlueTint: 1
	RequiresBuildableArea:
		AreaTypes: xeno-major
		Adjacent: 5

# Walls: cheap, sturdy, not needed to win, and dragged out in a line (place one end, then the other).
^Wall:
	Inherits: ^Structure
	Health:
		HP: 350
	-MustBeDestroyed:
	-AppearsOnRadar:
	-ProvidesPrerequisite@buildingname:
	RevealsShroud:
		Range: 3c0
	LineBuild:
		Range: 5
		NodeTypes: wall
	LineBuildNode:
		Types: wall
	Valued:
		Cost: 20

