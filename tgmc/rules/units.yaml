# What a dead marine leaves behind: it falls over (the `die` sequence, played once by the make animation), then lies
# there for a while (`corpse`) before it is removed. TGMC has no marine death art, so mod/build_sprites.py draws both.
^MarineCorpse:
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Palette: player
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
		Sequence: corpse
	WithMakeAnimation:
		Sequence: die
	HiddenUnderFog:
		Type: CenterPosition
	KillsSelf:
		Delay: 750
		RemoveInstead: true

rifleman-corpse:
	Inherits: ^MarineCorpse
	RenderSprites:
		Image: rifleman

medic-corpse:
	Inherits: ^MarineCorpse
	RenderSprites:
		Image: medic

engineer-corpse:
	Inherits: ^MarineCorpse
	RenderSprites:
		Image: engineer

smartgunner-corpse:
	Inherits: ^MarineCorpse
	RenderSprites:
		Image: smartgunner

grenadier-corpse:
	Inherits: ^MarineCorpse
	RenderSprites:
		Image: grenadier

mortar-crew-corpse:
	Inherits: ^MarineCorpse
	RenderSprites:
		Image: mortar-crew
