# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.

^Unit:
	Health:
		HP: 120
	Mobile:
		Locomotor: foot
		Speed: 43
		TurnSpeed: 20
	Selectable:
		Bounds: 512, 768, -256, -512
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
	RevealsShroud:
		Range: 7c0
	HiddenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ScriptTriggers:
	AttackMove:
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100

^Infantry:
	Inherits: ^Unit
	Targetable@HEAL:
		RequiresCondition: damaged
		TargetTypes: Heal
	Targetable@HUMAN:
		TargetTypes: Human
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Voiced:
		VoiceSet: MarineVoice
	DeathSounds:
	WithDeathAnimation:
		DeathSequence: die
		FallbackSequence: die
		DeathTypes:
			ExplosionDeath: -gib
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackFrontal:
		Voice: Attack
	ActorLostNotification:

rifleman:
	Inherits: ^Infantry
	Armament@PRIMARY:
		MuzzleSequence: flash
		LocalOffset: 256,0,200
	WithMuzzleOverlay:
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 10
		Description: actor-rifleman.description
	Tooltip:
		Name: actor-rifleman.name
	Valued:
		Cost: 100

