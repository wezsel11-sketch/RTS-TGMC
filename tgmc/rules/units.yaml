# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.

^Unit:
	Health:
		HP: 100
	Mobile:
		Locomotor: foot
		Speed: 43
		TurnSpeed: 20
	Selectable:
		Bounds: 512, 768, -256, -512
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
	RevealsShroud:
		Range: 7c0
	HiddenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	AttackMove:
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100

^Infantry:
	Inherits: ^Unit
	Targetable@HEAL:
		RequiresCondition: damaged
		TargetTypes: Heal
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Voiced:
		VoiceSet: MarineVoice
	DeathSounds:
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackFrontal:

rifleman:
	Inherits: ^Infantry
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 10
		Description: actor-rifleman.description
	Tooltip:
		Name: actor-rifleman.name
	Valued:
		Cost: 100

medic:
	Inherits: ^Infantry
	Health:
		HP: 90
	Voiced:
		VoiceSet: CorpsmanVoice
	Armament@PRIMARY:
		Weapon: TGMCHeal
		Cursor: heal
		OutsideRangeCursor: heal-blocked
		TargetRelationships: Ally
		ForceTargetRelationships: None
	AutoTargetPriority@DEFAULT:
		ValidTargets: Infantry
	Tooltip:
		Name: actor-medic.name
	Valued:
		Cost: 120
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 20
		Description: actor-medic.description

engineer:
	Inherits: ^Infantry
	Health:
		HP: 100
	Armament@PRIMARY:
		Weapon: TGMCRepair
		Cursor: repair
		OutsideRangeCursor: repair-blocked
		TargetRelationships: Ally
		ForceTargetRelationships: None
	AutoTargetPriority@DEFAULT:
		ValidTargets: Structure
	Tooltip:
		Name: actor-engineer.name
	Valued:
		Cost: 130
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 30
		Description: actor-engineer.description

runner:
	Inherits: ^Unit
	Health:
		HP: 120
	Selectable:
		Bounds: 1024, 768, -512, -512
	Mobile:
		Speed: 90
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	WithDeathAnimation:
		DeathSequence: die
		FallbackSequence: die
	Voiced:
		VoiceSet: XenoVoice
	DeathSounds:
	Armament@PRIMARY:
		Weapon: TGMCClaws
	AttackFrontal:
	Tooltip:
		Name: actor-runner.name
	Valued:
		Cost: 50
	Buildable:
		Queue: Xeno
		BuildPaletteOrder: 10
		Description: actor-runner.description
