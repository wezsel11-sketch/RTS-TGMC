# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.

^Unit:
	Health:
		HP: 120
	Mobile:
		Locomotor: foot
		Speed: 43
		TurnSpeed: 20
	Selectable:
		Bounds: 512, 768, -256, -512
	# The selection box and the health bar (shown when selected or hurt, per the player's "status bars" setting)
	SelectionDecorations:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
	RevealsShroud:
		Range: 7c0
	HiddenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ScriptTriggers:
	AttackMove:
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100
	GivesExperience:

# Veterancy. A unit gains experience when it kills (the victim's cost, or `Experience`), and each rank is reached at a
# percentage of its own cost. The condition `rank` is granted once per rank, so `rank == 2` means second rank (the same
# pattern OpenRA's Red Alert mod uses). Xenos are cheap, so they rank up a little faster than marines to keep the
# marines' lead from snowballing (see the balance notes in the README).
^RankBonuses:
	FirepowerMultiplier@RANK1:
		Modifier: 110
		RequiresCondition: rank == 1
	FirepowerMultiplier@RANK2:
		Modifier: 120
		RequiresCondition: rank == 2
	FirepowerMultiplier@RANK3:
		Modifier: 130
		RequiresCondition: rank == 3
	DamageMultiplier@RANK1:
		Modifier: 95
		RequiresCondition: rank == 1
	DamageMultiplier@RANK2:
		Modifier: 90
		RequiresCondition: rank == 2
	DamageMultiplier@RANK3:
		Modifier: 85
		RequiresCondition: rank == 3
	SpeedMultiplier@RANK3:
		Modifier: 110
		RequiresCondition: rank == 3
	ChangesHealth@HEROIC:
		Step: 2
		Delay: 25
		StartIfBelow: 100
		RequiresCondition: rank == 3
	WithDecoration@RANK1:
		Image: rank-pips
		Sequence: rank-1
		Position: BottomLeft
		Margin: 7, -5
		RequiresCondition: rank == 1
	WithDecoration@RANK2:
		Image: rank-pips
		Sequence: rank-2
		Position: BottomLeft
		Margin: 7, -5
		RequiresCondition: rank == 2
	WithDecoration@RANK3:
		Image: rank-pips
		Sequence: rank-3
		Position: BottomLeft
		Margin: 7, -5
		RequiresCondition: rank == 3

^MarineRanks:
	Inherits: ^RankBonuses
	GainsExperience:
		LevelUpNotification: LevelUp
		Conditions:
			250: rank
			500: rank
			900: rank

^XenoRanks:
	Inherits: ^RankBonuses
	GainsExperience:
		LevelUpNotification: LevelUp
		Conditions:
			150: rank
			300: rank
			500: rank

^Infantry:
	Inherits: ^Unit
	Inherits@ranks: ^MarineRanks
	Targetable@HEAL:
		RequiresCondition: damaged
		TargetTypes: Heal
	Targetable@HUMAN:
		TargetTypes: Human
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	# Visible wounds: blood on the body at 75% health and below, more at 50%, the most at 25%, and a limp at 25%
	GrantConditionOnDamageState@MEDIUM:
		Condition: wounded
		ValidDamageStates: Medium, Heavy, Critical
	GrantConditionOnDamageState@HEAVY:
		Condition: badly-wounded
		ValidDamageStates: Heavy, Critical
	GrantConditionOnDamageState@CRITICAL:
		Condition: crippled
		ValidDamageStates: Critical
	WithIdleOverlay@WOUNDED:
		Image: wounds
		Sequence: medium
		RequiresCondition: wounded && !badly-wounded
	WithIdleOverlay@BADLYWOUNDED:
		Image: wounds
		Sequence: heavy
		RequiresCondition: badly-wounded && !crippled
	WithIdleOverlay@CRIPPLED:
		Image: wounds
		Sequence: critical
		RequiresCondition: crippled
	SpeedMultiplier@CRIPPLED:
		Modifier: 70
		RequiresCondition: crippled
	Voiced:
		VoiceSet: MarineVoice
	DeathSounds:
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackFrontal:
		Voice: Attack
	ActorLostNotification:

