	# A submachine gun as well as the hypospray: the gun has its own small magazine.
	-AmmoPool:
	-ReloadAmmoPool:
	Armament@GUN:
		Name: gun
		Weapon: TGMCSMG
	AmmoPool@gun:
		Name: gun
		Armaments: gun
		Ammo: 40
	ReloadAmmoPool@gun:
		AmmoPool: gun
		Delay: 60
		Count: 40
		ResetOnFire: true
		Sound: reload-smg.ogg
	AutoTargetPriority@GUN:
		ValidTargets: Ground
		Priority: 0
	Health:
		HP: 100
	Voiced:
		VoiceSet: CorpsmanVoice
	Armament@PRIMARY:
		Weapon: TGMCHeal
		Cursor: heal
		OutsideRangeCursor: heal-blocked
		TargetRelationships: Ally
		ForceTargetRelationships: None
	# Heal range is short, and marines spread out, so look further and walk over to a wounded one.
	AutoTarget:
		ScanRadius: 6
	AutoTargetPriority@DEFAULT:
		ValidTargets: Infantry
	AutoTargetPriority@INFECTED:
		ValidTargets: Infected
		Priority: 10
	Tooltip:
		Name: actor-medic.name
	Valued:
		Cost: 120
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 20
		Description: actor-medic.description

