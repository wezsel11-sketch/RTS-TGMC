	ActiveAbility@detonate:
		OrderName: AbilityDetonate
		Slot: 1
		Label: Detonate
		Aim: Self
		Weapon: TGMCVestBlast
		FuseTicks: 50
		SelfDestruct: true
		Cooldown: 0
	Tooltip:
		Name: actor-bomber.name
	Valued:
		Cost: 120
	Buildable:
		Queue: Infantry
		Prerequisites: armory
		BuildPaletteOrder: 90
		Description: actor-bomber.description

# Mirage decoy (the squad leader's Mirage grenade): stands where it is put, draws fire, dies in a few hits, and fades after 30 seconds.
mirage-decoy:
	Inherits: ^Infantry
	# It never moves and never fires: it only stands there to be shot at.
	TgmcMobile:
		Speed: 0
	AutoTarget:
		InitialStance: HoldFire
	# The decoy wears a rifleman's body (its own sprite is not needed).
	RenderSprites:
		Image: rifleman
	Health:
		HP: 60
	Expires:
		Ticks: 750
	Tooltip:
		Name: actor-mirage-decoy.name

# Squad leader (TGMC kit): the squad's rifleman with the squad's commander role. Unlocked at the Armory.
squad_leader:
	Inherits: ^Infantry
	# Smoke cloak grenade (TGMC kit): a smoke screen on the squad where the leader stands; anyone inside is smoked (see smoked in ^Unit).
	ActiveAbility@smokecloak:
		OrderName: AbilitySmokeCloak
		Slot: 1
		Label: Smoke
		Aim: Self
		Weapon: TGMCSmokeScreen
		Cooldown: 2400
	# Mirage decoy: a fake marine dropped four cells ahead.
	ActiveAbility@mirage:
		OrderName: AbilityMirage
		Slot: 2
		Label: Mirage
		Aim: Forward
		ForwardDistance: 4c0
		Weapon: TGMCMirage
		Cooldown: 3000
	# Fire-support mark: the nearest enemy in range gets a sensor ping, showing it to the squad.
	ActiveAbility@mark:
		OrderName: AbilityMark
		Slot: 3
		Label: Mark
		Aim: Nearest
		Range: 12c0
		Weapon: TGMCMarkTarget
		Cooldown: 1800
	Armament@PRIMARY:
		Weapon: TGMCRifle
		MuzzleSequence: flash
		LocalOffset: 256,0,200
	Buildable:
		Queue: Infantry
		Prerequisites: armory
		BuildPaletteOrder: 15
		Description: actor-squad-leader.description
	Tooltip:
		Name: actor-squad-leader.name
	Valued:
		Cost: 180

