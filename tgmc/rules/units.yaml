runner:
	Inherits: ^Xeno
	# Pounce: press the deploy key (F by default) for three seconds of sprinting, with claws that hit harder and stun.
	# The ExternalCondition lets a map script start a pounce too (actor.GrantCondition("pouncing", ticks)).
	ExternalCondition@POUNCE:
		Condition: pouncing
	GrantChargedConditionOnToggle@POUNCE:
		ActivatedCondition: pouncing
		ChargeDuration: 500
		ConditionDuration: 75
		Voice: Attack
		DeactivatedColor: 8a5a2a
		ActivatedColor: ffb030
	SpeedMultiplier@POUNCE:
		Modifier: 230
		RequiresCondition: pouncing
	Armament@PRIMARY:
		RequiresCondition: !pouncing
	Armament@POUNCE:
		Weapon: TGMCPounce
		RequiresCondition: pouncing
	WithIdleOverlay@TEAM:
		Sequence: ring-64
	Voiced:
		VoiceSet: RunnerVoice
	Health:
		HP: 100
	Selectable:
		Bounds: 1024, 768, -512, -512
	Mobile:
		Speed: 115
	Tooltip:
		Name: actor-runner.name
	Valued:
		Cost: 50
	Buildable:
		Queue: Xeno
		BuildPaletteOrder: 10
		Description: actor-runner.description

hunter:
	Inherits: ^Xeno
