# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.

^Unit:
	Health:
		HP: 120
	TgmcMobile:
		Locomotor: foot
		Speed: 108
		TurnSpeed: 160
		PauseOnCondition: stunned
	# A click picks a unit before a building under it, and the click area is a little roomier than the sprite.
	Selectable:
		# A 64-pixel frame whose figure fills the middle 32x40 px: the box is centred on the figure, not on the feet.
		Bounds: 1024, 1280, 0, 0
		Priority: 20
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
	RevealsShroud:
		Range: 7c0
	HiddenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ScriptTriggers:
	AttackMove:
	# Patrol: walk between here and the cell you pick (the Patrol button on the command card).
	Patrol:
	SpreadOut:
	# What you have selected must be easy to see: brackets, a health bar, and a ring that breathes.
	SelectionDecorations:
	SelectionRing:
	# Ranged weapons light up the ground at the muzzle for a moment (see fx-light in sequences/misc.yaml).
	MuzzleGlow:
	# Damage and healing float up from the unit as numbers (a lobby option switches them off).
	DamageNumbers:
	# Each shot does 85 to 115 percent of its weapon's damage.
	DamageVariation:
	# Warheads can stun a unit with this condition (pounce, stomp): it stands still and does not fire until it wears off.
	ExternalCondition@stun:
		Condition: stunned
	# Caught in a gas cloud: slower and tinted green while it lasts.
	ExternalCondition@gassed:
		Condition: gassed
	SpeedMultiplier@gassed:
		RequiresCondition: gassed
		Modifier: 60
	WithColoredOverlay@gassed:
		RequiresCondition: gassed
		Color: 70FF4050
	# A unit hit by a bullet or a claw flashes white for a moment, so you can see who is under fire.
	ExternalCondition@hitflash:
		Condition: hitflash
	WithColoredOverlay@hitflash:
		RequiresCondition: hitflash
		Color: FFFFFF90
	# Firing on the move is inaccurate: scatter is tripled while walking (weapons set their own base Inaccuracy).
	GrantConditionOnMovement@moving:
		Condition: moving
		ValidMovementTypes: Horizontal
	InaccuracyMultiplier@moving:
		RequiresCondition: moving
		Modifier: 300
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100

^Infantry:
	Inherits: ^Unit
	# A flashlight: a small pool of light around the marine (see TerrainLighting in world.yaml). Off (0) on normal maps, where the ground is
	# already at full light and the pool would only blow the ground out; a dark-mode map turns it up (shot-lighting uses 0.6).
	TerrainLightSource:
		Range: 4c0
		Intensity: 0
		RedTint: 1
		GreenTint: 0.97
		BlueTint: 0.9
	# Balance: marines were losing every AI-vs-AI match, so each marine takes more hits (was 120).
	Health:
		HP: 170
	# Marines see further than xenos do (the rest of the army sees 7 cells).
	# Marines see only what a clear line reaches: rock and walls hide what is behind them (see TgmcSight in tgmc/code/Sight.cs).
	# ^Unit already gave the unit a plain circle of sight; this replaces it, so marines never see through walls.
	-RevealsShroud:
	TgmcSight:
		Range: 10c0
	# Marines bleed where they are hit, and drip when badly hurt (the blood lies on the floor for about half a minute).
	Bleeds:
	# A gibbed marine throws his body parts about; they lie there for a long time.
	ThrowsGibs:
		Parts: h-head, h-arm, h-leg, h-torso, h-mid1, h-mid2, h-mid3, h-up, h-down
	# Rifles and the like fling brass out of the right side (the casing sprite is TGMC's casings.dmi).
	EjectsCasings:
		Weapons: TGMCRifle, TGMCCarbine, TGMCM412, TGMCSMG, TGMCShotgun, TGMCSmartgun, TGMCSniper, TGMCMG60
	Targetable@HEAL:
		RequiresCondition: damaged
		TargetTypes: Heal
	Targetable@HUMAN:
		TargetTypes: Human
	FireWarheadsOnDeath:
		Weapon: TGMCDeathBlood
		EmptyWeapon: TGMCDeathBlood
	DetectCloaked:
		Range: 2c0
	# Standing in a smoke screen: harder to hit.
	ExternalCondition@smoked:
		Condition: smoked
	DamageMultiplier@smoked:
		RequiresCondition: smoked
		Modifier: 55
	# An Ammo Station nearby speeds the reload.
	ExternalCondition@resupply:
		Condition: resupplied
	ReloadAmmoDelayMultiplier@resupply:
		RequiresCondition: resupplied
		Modifier: 35
	# A facehugger can latch onto a marine that carries no embryo. Healing clears it; otherwise it bursts into a larva.
	Targetable@INFEST:
		TargetTypes: Infestable
		RequiresCondition: !infected
	# An infected marine is a heal target even at full health, so corpsmen and medbays go for him first.
	Targetable@INFECTED:
		TargetTypes: Infected
		RequiresCondition: infected
	Infestable:
		InfectSounds: xeno-hiss-1.ogg, xeno-hiss-2.ogg, xeno-hiss-3.ogg
		CrySounds: preburst-1.ogg, preburst-2.ogg, preburst-3.ogg
		BurstSounds: chestburst-1.ogg, chestburst-2.ogg
		CureSounds: heal.ogg
	WithColoredOverlay@infected:
		RequiresCondition: infected
		Color: 55FF5566
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Voiced:
		VoiceSet: MarineVoice
	DeathSounds:
	# The body lies where it fell for three minutes, then fades away.
	WithLingeringCorpse:
		DeathSequence: die
		FallbackSequence: die
		Linger: 4500
		Fade: 300
		DeathTypes:
			ExplosionDeath: -gib
	# A marine that is down does not walk.
	TgmcMobile:
		PauseOnCondition: hugged || stunned
	WithInfantryBody:
		RequiresCondition: !hugged
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	# Knocked flat by a facehugger: lies on his side and does nothing until it lets go.
	WithInfantryBody@hugged:
		RequiresCondition: hugged
		MoveSequence: down
		StandSequences: down
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackWhileMoving:
		FacingTolerance: 40
		Voice: Attack
		PauseOnCondition: hugged || stunned
	ActorLostNotification:
	# A magazine: it empties, then the marine reloads (the reload starts a moment after the last shot). Each kind of
	# marine sets its own size and reload time.
	AmmoPool:
		Ammo: 30
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 60
		Count: 30
		ResetOnFire: true
		Sound: reload-rifle.ogg
	AmmoBar:
	# Words over a marine's head: what is wrong with him, and his magazine when selected.
	StatusLabel@hugged:
		RequiresCondition: hugged
		Text: FACEHUGGED
		Color: FF4040
	StatusLabel@infected:
		RequiresCondition: infected && !hugged
		Text: INFECTED
		Color: FF6060
	StatusLabel@stunned:
		RequiresCondition: stunned
		Text: STUNNED
		Color: FFD040
		Line: 1
	StatusLabel@reload:
		RequiresCondition: !ammo
		Text: RELOADING
		Color: FFA040
		Line: 2
		OnlyWhenSelected: true
	StatusLabel@lowammo:
		RequiresCondition: ammo > 0 && ammo < 6
		Text: LOW AMMO
		Color: FFC060
		Line: 2
		OnlyWhenSelected: true

rifleman:
	Inherits: ^Infantry
	# Each rifleman carries one of three basic rifles, chosen at random when he is made: T-12 assault rifle, T-18 carbine
	# or M412. They differ in sprite (stand-carbine, stand-m412) and in weapon.
	GrantRandomCondition:
		Conditions: gun-ar, gun-carbine, gun-m412
	Armament@PRIMARY:
		RequiresCondition: gun-ar
		MuzzleSequence: flash
		LocalOffset: 256,0,200
	Armament@CARBINE:
		Name: primary
		Weapon: TGMCCarbine
		RequiresCondition: gun-carbine
		MuzzleSequence: flash
		LocalOffset: 256,0,200
	Armament@M412:
		Name: primary
		Weapon: TGMCM412
		RequiresCondition: gun-m412
		MuzzleSequence: flash
		LocalOffset: 256,0,200
	WithInfantryBody:
		RequiresCondition: !hugged && gun-ar
	WithInfantryBody@carbine:
		RequiresCondition: !hugged && gun-carbine
		MoveSequence: stand-carbine
		StandSequences: stand-carbine
		DefaultAttackSequence: stand-carbine
	WithInfantryBody@m412:
		RequiresCondition: !hugged && gun-m412
		MoveSequence: stand-m412
		StandSequences: stand-m412
		DefaultAttackSequence: stand-m412
	WithMuzzleOverlay:
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 10
		# Riflemen are the marines' first unit: they come off the line 30 percent quicker.
		BuildDurationModifier: 70
		Description: actor-rifleman.description
	Tooltip:
		Name: actor-rifleman.name
	Valued:
		Cost: 100

medic:
	Inherits: ^Infantry
