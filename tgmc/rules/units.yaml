# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.

^Unit:
	Health:
		HP: 100
	Mobile:
		Locomotor: foot
		Speed: 43
		TurnSpeed: 20
	Selectable:
		Bounds: 512, 768, -256, -512
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AttackMove:
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100

^Infantry:
	Inherits: ^Unit
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackFrontal:

rifleman:
	Inherits: ^Infantry
	Tooltip:
		Name: actor-rifleman.name
	Valued:
		Cost: 100

runner:
	Inherits: ^Unit
	Health:
		HP: 120
	Selectable:
		Bounds: 1024, 768, -512, -512
	Mobile:
		Speed: 90
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	WithDeathAnimation:
		DeathSequence: die
	Armament@PRIMARY:
		Weapon: TGMCClaws
	AttackFrontal:
	Tooltip:
		Name: actor-runner.name
	Valued:
		Cost: 50
