# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.

^Unit:
	Health:
		HP: 120
	Mobile:
		Locomotor: foot
		Speed: 43
		TurnSpeed: 20
	Selectable:
		Bounds: 512, 768, -256, -512
	# The selection box and the health bar (shown when selected or hurt, per the player's "status bars" setting)
	SelectionDecorations:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
	RevealsShroud:
		Range: 7c0
	HiddenUnderFog:
	MustBeDestroyed:
	AppearsOnRadar:
	ScriptTriggers:
	AttackMove:
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100
	GivesExperience:
	WithIdleOverlay@TEAM:
		Image: team
		Sequence: ring-32
		Palette: player
		IsPlayerPalette: true

# Veterancy. A unit gains experience when it kills (the victim's cost, or `Experience`), and each rank is reached at a
# percentage of its own cost. The condition `rank` is granted once per rank, so `rank == 2` means second rank (the same
# pattern OpenRA's Red Alert mod uses). Xenos are cheap, so they rank up a little faster than marines to keep the
# marines' lead from snowballing (see the balance notes in the README).
^RankBonuses:
	FirepowerMultiplier@RANK1:
		Modifier: 110
		RequiresCondition: rank == 1
	FirepowerMultiplier@RANK2:
		Modifier: 120
		RequiresCondition: rank == 2
	FirepowerMultiplier@RANK3:
		Modifier: 130
		RequiresCondition: rank == 3
	DamageMultiplier@RANK1:
		Modifier: 95
		RequiresCondition: rank == 1
	DamageMultiplier@RANK2:
		Modifier: 90
		RequiresCondition: rank == 2
	DamageMultiplier@RANK3:
		Modifier: 85
		RequiresCondition: rank == 3
	SpeedMultiplier@RANK3:
		Modifier: 110
		RequiresCondition: rank == 3
	ChangesHealth@HEROIC:
		Step: 2
		Delay: 25
		StartIfBelow: 100
		RequiresCondition: rank == 3
	WithDecoration@RANK1:
		Image: rank-pips
		Sequence: rank-1
		Position: BottomLeft
		Margin: 7, -5
		RequiresCondition: rank == 1
	WithDecoration@RANK2:
		Image: rank-pips
		Sequence: rank-2
		Position: BottomLeft
		Margin: 7, -5
		RequiresCondition: rank == 2
	WithDecoration@RANK3:
		Image: rank-pips
		Sequence: rank-3
		Position: BottomLeft
		Margin: 7, -5
		RequiresCondition: rank == 3

# Research. A Research Lab (marines) or a Hive Core (xenos) improves every unit of that side that is built or already standing.
^MarineResearch:
	GrantConditionOnPrerequisite@RESEARCH:
		Condition: researched
		Prerequisites: research-lab
	DamageMultiplier@RESEARCH:
		Modifier: 85
		RequiresCondition: researched
	FirepowerMultiplier@RESEARCH:
		Modifier: 110
		RequiresCondition: researched

^XenoResearch:
	GrantConditionOnPrerequisite@RESEARCH:
		Condition: researched
		Prerequisites: hive-core
	DamageMultiplier@RESEARCH:
		Modifier: 85
		RequiresCondition: researched
	SpeedMultiplier@RESEARCH:
		Modifier: 108
		RequiresCondition: researched

# Weeds. Near a Weed Node or a silo xenos are quicker and mend slowly.
^OnWeeds:
	ExternalCondition@WEEDS:
		Condition: on-weeds
	SpeedMultiplier@WEEDS:
		Modifier: 125
		RequiresCondition: on-weeds
	ChangesHealth@WEEDS:
		Step: 3
		Delay: 25
		StartIfBelow: 100
		RequiresCondition: on-weeds

^MarineRanks:
	Inherits: ^RankBonuses
	GainsExperience:
		LevelUpNotification: LevelUp
		Conditions:
			250: rank
			500: rank
			900: rank

^XenoRanks:
	Inherits: ^RankBonuses
	GainsExperience:
		LevelUpNotification: LevelUp
		Conditions:
			150: rank
			300: rank
			500: rank

^Infantry:
	Inherits: ^Unit
	Inherits@ranks: ^MarineRanks
	Inherits@research: ^MarineResearch
	Targetable@HEAL:
		RequiresCondition: damaged
		TargetTypes: Heal
	Targetable@HUMAN:
		TargetTypes: Human
	Crushable:
		CrushClasses: infantry
	# Abilities that act on marines. A stun (Runner pounce) holds one in place for a moment, and a screech (Queen) slows and
	# weakens every marine in an area. Both come from outside: a weapon's warhead, or the Queen's support power.
	ExternalCondition@STUN:
		Condition: stunned
	ExternalCondition@SCREECH:
		Condition: screeched
	Mobile:
		PauseOnCondition: stunned
	Armament@PRIMARY:
		PauseOnCondition: stunned
	SpeedMultiplier@SCREECH:
		Modifier: 40
		RequiresCondition: screeched
	ReloadDelayMultiplier@SCREECH:
		Modifier: 200
		RequiresCondition: screeched
	WithColoredOverlay@STUN:
		Color: 6fe0ff70
		RequiresCondition: stunned
	WithColoredOverlay@SCREECH:
		Color: b455ff60
		RequiresCondition: screeched
	# Marines spot a stealthed xeno only up close
	DetectCloaked:
		Range: 2c0
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	# Visible wounds: blood on the body at 75% health and below, more at 50%, the most at 25%, and a limp at 25%
	GrantConditionOnDamageState@MEDIUM:
		Condition: wounded
		ValidDamageStates: Medium, Heavy, Critical
	GrantConditionOnDamageState@HEAVY:
		Condition: badly-wounded
		ValidDamageStates: Heavy, Critical
	GrantConditionOnDamageState@CRITICAL:
		Condition: crippled
		ValidDamageStates: Critical
	WithIdleOverlay@WOUNDED:
		Image: wounds
		Sequence: medium
		RequiresCondition: wounded && !badly-wounded
	WithIdleOverlay@BADLYWOUNDED:
		Image: wounds
		Sequence: heavy
		RequiresCondition: badly-wounded && !crippled
	WithIdleOverlay@CRIPPLED:
		Image: wounds
		Sequence: critical
		RequiresCondition: crippled
	SpeedMultiplier@CRIPPLED:
		Modifier: 70
		RequiresCondition: crippled
	Voiced:
		VoiceSet: MarineVoice
	DeathSounds:
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackFrontal:
		Voice: Attack
	ActorLostNotification:

