# Units from TGMC art. The sprite sheets and sequence files are generated by mod/build_sprites.py.
# Sequence names here must exist in the generated sequences/*.yaml.
# Buildable Prerequisites is the unit's faction (marines or xenos). player.yaml grants it per faction.

^Unit:
	Health:
		HP: 100
	Mobile:
		Locomotor: foot
		Speed: 43
		TurnSpeed: 20
	Selectable:
		Bounds: 512, 768, -256, -512
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, Infantry
	AutoTarget:
		InitialStance: AttackAnything
	AttackMove:
	RenderSprites:
		Palette: player
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand
	Valued:
		Cost: 100

^Infantry:
	Inherits: ^Unit
	WithInfantryBody:
		MoveSequence: run
		StandSequences: stand
		DefaultAttackSequence: attack
	Armament@PRIMARY:
		Weapon: TGMCRifle
	AttackFrontal:

# Marines. Same body and queue. Each unit's weapon is its own role.
rifleman:
	Inherits: ^Infantry
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Infantry
		BuildPaletteOrder: 10
		Description: actor-rifleman.description
		Prerequisites: marines
	Tooltip:
		Name: actor-rifleman.name
	Valued:
		Cost: 100

