# The Upgrades tab (see PLAN-upgrades.md). Buying an upgrade creates the hidden actor below for the player; ProvidesPrerequisite then hands out a
# prerequisite with the actor's name, and units that want the upgrade grant themselves a condition from it (GrantConditionOnPrerequisite).
# BuildLimit 1 keeps one copy. The actor has no health and no place on the map, so nothing can kill it: an upgrade bought stays bought.

^Upgrade:
	Buildable:
		Queue: Upgrade
		BuildLimit: 1
	# The palette reads the icon sequence through this trait. Nothing else renders: the actor has no sprite body.
	RenderSprites:
	# The tooltip wants mouse bounds; the actor is never on the map, so nothing can be clicked.
	Interactable:
	ProvidesPrerequisite:

# The rifleman ladder: he starts with the T-18 carbine, then the T-12, then the M412 (see rifleman in units.yaml).
upgrade-rifle-t12:
	Inherits: ^Upgrade
	Buildable:
		Prerequisites: armory, ~faction-marines
		BuildPaletteOrder: 10
		Description: actor-upgrade-rifle-t12.description
	Tooltip:
		Name: actor-upgrade-rifle-t12.name
	Valued:
		Cost: 300

upgrade-rifle-m412:
	Inherits: ^Upgrade
	Buildable:
		Prerequisites: armory, upgrade-rifle-t12, ~faction-marines
		BuildPaletteOrder: 11
		Description: actor-upgrade-rifle-m412.description
	Tooltip:
		Name: actor-upgrade-rifle-m412.name
	Valued:
		Cost: 500

