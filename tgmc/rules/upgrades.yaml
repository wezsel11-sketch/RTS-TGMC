		Name: actor-upgrade-claws.name
	Valued:
		Cost: 300

upgrade-hive-speed:
	Inherits: ^Upgrade
	Buildable:
		Prerequisites: evolution-tower, ~faction-xenos
		BuildPaletteOrder: 23
		Description: actor-upgrade-hive-speed.description
	Tooltip:
		Name: actor-upgrade-hive-speed.name
	Valued:
