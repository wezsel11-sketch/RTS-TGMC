# Effects (fx-* images) are drawn by mod/build_sprites.py from TGMC art. Bullets fly as tracers, hits splash sparks on structures
# and acid-green gore on xenos, spit is a visible acid glob, the grenade explodes, and melee hits get their own flash.
TGMCRifle:
	Range: 6c0
	ReloadDelay: 15
	Report: rifle-fire-1.ogg, rifle-fire-2.ogg, rifle-fire-3.ogg
	Projectile: Bullet
		Speed: 600
		Image: fx-bullet
	Warhead@1Dam: SpreadDamage
		Damage: 14
		Spread: 128
		Versus:
			Heavy: 35
		ValidRelationships: Enemy
	Warhead@2Hit: CreateEffect
		ImpactSounds: hit-bullet-1.ogg, hit-bullet-2.ogg, hit-bullet-3.ogg, hit-bullet-4.ogg
		ImpactSoundChance: 55
		ValidRelationships: Enemy
		ValidTargets: Alien, Structure
	Warhead@3Cry: CreateEffect
		ImpactSounds: xeno-larva-1.ogg, xeno-larva-2.ogg, xeno-larva-3.ogg, xeno-larva-4.ogg, xeno-growl-1.ogg
		ImpactSoundChance: 18
		ValidRelationships: Enemy
		ValidTargets: Alien
	Warhead@4Gore: CreateEffect
		Image: fx-impact
		Explosions: gore
		ValidRelationships: Enemy
		ValidTargets: Alien
	Warhead@5Spark: CreateEffect
		Image: fx-impact
		Explosions: spark
		ValidRelationships: Enemy
		ValidTargets: Structure

TGMCSentry:
	Inherits: TGMCRifle
	Report: sentry-fire.ogg
	Projectile: Bullet
		Sequences: large
	Warhead@1Dam: SpreadDamage
		Damage: 10

TGMCHeal:
	Range: 3c0
	ReloadDelay: 60
	Report: heal.ogg
	ValidTargets: Heal
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		Damage: -20
		ValidRelationships: Ally
		ValidTargets: Heal
	Warhead@2Fx: CreateEffect
		Image: fx-impact
		Explosions: heal
		ValidRelationships: Ally
		ValidTargets: Heal

TGMCRepair:
	Range: 2c0
	ReloadDelay: 40
	Report: repair.ogg
	ValidTargets: Repair
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		Damage: -30
		ValidRelationships: Ally
		ValidTargets: Repair
	Warhead@2Fx: CreateEffect
		Image: fx-impact
		Explosions: spark
		ImpactSounds: spark-1.ogg, spark-2.ogg
		ImpactSoundChance: 40
		ValidRelationships: Ally
		ValidTargets: Repair

# Xeno claws: a melee hit. Marines bleed, marine structures throw sparks.
TGMCClaws:
	Range: 1c256
	ReloadDelay: 14
	Report: claw-swipe-1.ogg, claw-swipe-2.ogg, claw-swipe-3.ogg
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		Versus:
			Heavy: 35
		Damage: 20
	Warhead@2Hit: CreateEffect
		ImpactSounds: hit-armor-1.ogg, hit-armor-2.ogg, hit-armor-3.ogg
		ImpactSoundChance: 50
		ValidRelationships: Enemy
		ValidTargets: Human
	Warhead@3Cry: CreateEffect
		ImpactSounds: marine-m-pain-1.ogg, marine-m-pain-2.ogg, marine-m-pain-3.ogg, marine-f-pain-1.ogg, marine-f-pain-2.ogg, marine-f-pain-3.ogg, marine-m-gored-1.ogg
		ImpactSoundChance: 45
		ValidRelationships: Enemy
		ValidTargets: Human
	Warhead@4Blood: CreateEffect
		Image: fx-impact
		Explosions: blood
		ImpactSounds: splat.ogg
		ImpactSoundChance: 40
		ValidRelationships: Enemy
		ValidTargets: Human
	Warhead@5Spark: CreateEffect
		Image: fx-impact
		Explosions: spark
		ValidRelationships: Enemy
		ValidTargets: Structure

# Sentinel spit: a lobbed acid glob. It is fast and splashes wide enough to land on a walking target.
TGMCSpit:
	Range: 5c0
	ReloadDelay: 30
	Report: acid-spit-1.ogg, acid-spit-2.ogg
	TargetActorCenter: true
	Projectile: Bullet
		Speed: 450
		Image: fx-acid
		Shadow: true
		LaunchAngle: 60
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Damage: 16
		Spread: 256
		Falloff: 100, 100, 60, 0
		Versus:
			Heavy: 70
		ValidRelationships: Enemy
	Warhead@2Hit: CreateEffect
		Image: fx-acid
		Explosions: splash
		ImpactSounds: acid-impact.ogg
		ImpactSoundChance: 70
		ForceDisplayAtGroundLevel: true
		ValidRelationships: Enemy
		ValidTargets: Ground, Water, Structure

TGMCMend:
	Range: 2c0
	ReloadDelay: 40
	Report: resin-build.ogg
	ValidTargets: Repair
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		Damage: -30
		ValidRelationships: Ally
		ValidTargets: Repair
	Warhead@2Fx: CreateEffect
		Image: fx-impact
		Explosions: heal
		ValidRelationships: Ally
		ValidTargets: Repair

# Resin turret: the same acid glob as the Sentinel, with more punch.
TGMCAcid:
	Range: 6c0
	ReloadDelay: 25
	Report: acid-spit-1.ogg, acid-spit-2.ogg
	TargetActorCenter: true
	Projectile: Bullet
		Speed: 450
		Image: fx-acid
		Shadow: true
		LaunchAngle: 60
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Damage: 30
		Spread: 256
		Falloff: 100, 100, 60, 0
		Versus:
			Heavy: 70
		ValidRelationships: Enemy
	Warhead@2Hit: CreateEffect
		Image: fx-acid
		Explosions: splash
		ImpactSounds: acid-impact.ogg
		ImpactSoundChance: 70
		ForceDisplayAtGroundLevel: true
		ValidRelationships: Enemy
		ValidTargets: Ground, Water, Structure

# Marine gunners. Smartgunner: fast, spread bullets. Grenadier: a grenade launcher, lobbed and explosive.
TGMCSmartgun:
	Range: 7c0
	ReloadDelay: 5
	Report: rifle-fire-1.ogg, rifle-fire-2.ogg, rifle-fire-3.ogg
	Projectile: Bullet
		Speed: 900
		Image: fx-bullet
		Inaccuracy: 256
		InaccuracyType: Maximum
	Warhead@1Dam: SpreadDamage
		Damage: 7
		Spread: 1c0
		Versus:
			Heavy: 40
		ValidRelationships: Enemy
	Warhead@2Hit: CreateEffect
		ImpactSounds: hit-bullet-1.ogg, hit-bullet-2.ogg, hit-bullet-3.ogg, hit-bullet-4.ogg
		ImpactSoundChance: 40
		ValidRelationships: Enemy
		ValidTargets: Alien, Structure
	Warhead@3Gore: CreateEffect
		Image: fx-impact
		Explosions: gore
		ValidRelationships: Enemy
		ValidTargets: Alien
	Warhead@4Spark: CreateEffect
		Image: fx-impact
		Explosions: spark
		ValidRelationships: Enemy
		ValidTargets: Structure

TGMCGrenade:
	Range: 8c0
	ReloadDelay: 40
	Report: grenade-launch.ogg
	Projectile: Bullet
		Speed: 280
		Image: grenade
		Shadow: true
		LaunchAngle: 165
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Damage: 45
		Spread: 2c0
		Falloff: 100, 50, 20, 0
		Versus:
			Heavy: 80
		ValidRelationships: Enemy
	Warhead@2Boom: CreateEffect
		Image: fx-blast
		Explosions: grenade
		ImpactSounds: explosion-1.ogg, explosion-2.ogg, explosion-3.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure

# Xeno Warrior: a wide melee slam that kicks up a shockwave of dust.
TGMCSlam:
	Range: 1c512
	ReloadDelay: 35
	Report: claw-swipe-1.ogg, claw-swipe-2.ogg, claw-swipe-3.ogg
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Damage: 30
		Spread: 1c256
		Falloff: 100, 60, 25
		Versus:
			Heavy: 55
		ValidRelationships: Enemy
	Warhead@2Slam: CreateEffect
		Image: fx-slam
		Explosions: slam
		ImpactSounds: slam-1.ogg, slam-2.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@3Blood: CreateEffect
		Image: fx-impact
		Explosions: blood
		ImpactSounds: splat.ogg
		ImpactSoundChance: 50
		ValidRelationships: Enemy
		ValidTargets: Human

# A structure's death blast: only the picture. The death sound is the structure's own (DeathSounds), and nothing is damaged.
TGMCBlastSmall:
	Warhead@1Boom: CreateEffect
		Image: fx-blast
		Explosions: small
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure

TGMCBlastBig:
	Warhead@1Boom: CreateEffect
		Image: fx-blast-big
		Explosions: big
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure

# Runner Pounce (while the `pouncing` condition is on, see units.yaml): the claws hit harder and stun a marine for two seconds.
TGMCPounce:
	Inherits: TGMCClaws
	Warhead@1Dam: TargetDamage
		Damage: 36
	Warhead@6Stun: GrantExternalCondition
		Condition: stunned
		Duration: 50
		ValidRelationships: Enemy
		ValidTargets: Human

# ---------------------------------------------------------------- armour and artillery
# Versus on a warhead is a percentage by armour type (None is the default): rifles and claws struggle against Heavy armour,
# the mech's cannon, the mortar and the Boiler's acid do not.

# Xeno Crusher: a huge slow melee swing that wrecks armour and structures; it also tramples marines it walks over.
TGMCCrusherSlam:
	Range: 1c768
	ReloadDelay: 30
	Report: slam-1.ogg, slam-2.ogg
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Damage: 48
		Spread: 1c0
		Falloff: 100, 60, 25
		Versus:
			Heavy: 100
		ValidRelationships: Enemy
	Warhead@2Slam: CreateEffect
		Image: fx-slam
		Explosions: slam
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@3Blood: CreateEffect
		Image: fx-impact
		Explosions: blood
		ImpactSounds: splat.ogg
		ImpactSoundChance: 50
		ValidRelationships: Enemy
		ValidTargets: Human

# Xeno Boiler: lobs a heavy acid bomb a long way, but not at anything close. Strong against armour.
TGMCBoilerBomb:
	Range: 12c0
	MinRange: 4c0
	ReloadDelay: 110
	Report: acid-spit-1.ogg, acid-spit-2.ogg
	TargetActorCenter: true
	Projectile: Bullet
		Speed: 170
		Image: fx-acid
		Shadow: true
		LaunchAngle: 200
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Damage: 58
		Spread: 2c0
		Falloff: 100, 70, 30, 0
		Versus:
			Heavy: 130
		ValidRelationships: Enemy
	Warhead@2Hit: CreateEffect
		Image: fx-acid
		Explosions: splash
		ImpactSounds: acid-impact.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure

# Marine mech: a heavy cannon shell (strong against armour and structures) and a light machine gun for infantry.
TGMCMechCannon:
	Inherits: TGMCRifle
	Range: 7c256
	ReloadDelay: 45
	Report: grenade-launch.ogg
	Projectile: Bullet
		Speed: 420
		Sequences: large
	Warhead@1Dam: SpreadDamage
		Damage: 40
		Spread: 384
		Versus:
			Heavy: 120
	Warhead@7Boom: CreateEffect
		Image: fx-blast
		Explosions: small
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure

TGMCMechGun:
	Inherits: TGMCRifle
	Range: 6c0
	ReloadDelay: 8
	Report: sentry-fire.ogg
	Warhead@1Dam: SpreadDamage
		Damage: 9

# Marine mortar crew: a long, slow, lobbed shell with a wide splash, and a dead zone close in.
TGMCMortar:
	Range: 13c0
	MinRange: 3c0
	ReloadDelay: 100
	Report: grenade-launch.ogg
	Projectile: Bullet
		Speed: 150
		Image: grenade
		Shadow: true
		LaunchAngle: 250
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Damage: 42
		Spread: 2c512
		Falloff: 100, 60, 25, 0
		Versus:
			Heavy: 70
		ValidRelationships: Enemy
	Warhead@2Boom: CreateEffect
		Image: fx-blast
		Explosions: grenade
		ImpactSounds: explosion-1.ogg, explosion-2.ogg, explosion-3.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure

# The orbital strike's blast, fired when its marker actor dies (structures.yaml: orbital-strike).
TGMCOrbital:
	Warhead@1Dam: SpreadDamage
		Damage: 260
		Spread: 3c0
		Falloff: 100, 85, 55, 30, 10, 0
		Versus:
			Heavy: 100
		ValidRelationships: Enemy
	Warhead@2Boom: CreateEffect
		Image: fx-blast-big
		Explosions: big
		ImpactSounds: explosion-1.ogg, explosion-2.ogg, explosion-3.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
