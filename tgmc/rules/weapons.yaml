# Effects (fx-* images) are drawn by mod/build_sprites.py from TGMC art. Bullets fly as tracers, hits splash sparks on structures
# and acid-green gore on xenos, spit is a visible acid glob, the grenade explodes, and melee hits get their own flash.
TGMCRifle:
	Range: 6c0
	# Fires in bursts of three, then the trigger rests (TGMC rifles have burst_amount 3 and a longer delay between bursts).
	Burst: 3
	BurstDelays: 3
	ReloadDelay: 18
	Report: rifle-fire-1.ogg, rifle-fire-2.ogg, rifle-fire-3.ogg, rifle-fire-4.ogg, rifle-fire-5.ogg
	# Shots scatter a little at full range. Units that fire on the move multiply this (see ^Unit), and a shot that lands
	# more than about a cell off its mark misses.
	Projectile: Bullet
		Speed: 600
		Image: fx-bullet
		Inaccuracy: 384
	Warhead@8Flash: GrantExternalCondition
		Condition: hitflash
		Duration: 3
		Range: 0c256
		ValidRelationships: Enemy
		ValidTargets: Infantry
	# A bullet that misses still chips what is around where it lands: furniture, barricades, windows.
	Warhead@4Stray: SpreadDamage
		Damage: 6
		Spread: 1c0
		Falloff: 100, 40, 0
		ValidRelationships: Neutral
		ValidTargets: MapObject
	Warhead@1Dam: SpreadDamage
		Damage: 8
		Spread: 128
		# Armoured xenos shrug off ordinary rounds (armour classes are set on the xeno castes; see units.yaml).
		Versus:
			Heavy: 70
		ValidRelationships: Neutral, Enemy
	Warhead@2Hit: CreateEffect
		ImpactSounds: hit-bullet-1.ogg, hit-bullet-2.ogg, hit-bullet-3.ogg, hit-bullet-4.ogg
		ImpactSoundChance: 55
		ValidRelationships: Enemy
		ValidTargets: Alien, Structure
	# A shot that finds no one is a puff of dust where it lands. (Impacts on an actor are ignored by this warhead.)
	Warhead@6Dust: CreateEffect
		Image: fx-impact
		Explosions: dust
		ValidTargets: Ground
		InvalidTargets: Infantry, Structure
		ForceDisplayAtGroundLevel: true
	Warhead@9Light1: CreateEffect
		Image: fx-light
		Explosions: impact
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground
	Warhead@3Cry: CreateEffect
		ImpactSounds: xeno-larva-1.ogg, xeno-larva-2.ogg, xeno-larva-3.ogg, xeno-larva-4.ogg, xeno-growl-1.ogg
		ImpactSoundChance: 18
		ValidRelationships: Enemy
		ValidTargets: Alien
	Warhead@4Gore: CreateEffect
		Image: fx-impact
		Explosions: gore
		ValidRelationships: Enemy
		ValidTargets: Alien
	Warhead@9Light2: CreateEffect
		Image: fx-light
		Explosions: impact
		ForceDisplayAtGroundLevel: true
		ValidTargets: Alien
	Warhead@5Spark: CreateEffect
		Image: fx-impact
		Explosions: spark
		ValidRelationships: Enemy
		ValidTargets: Structure
	Warhead@9Light3: CreateEffect
		Image: fx-light
		Explosions: impact
		ForceDisplayAtGroundLevel: true
		ValidTargets: Structure

TGMCSadar:
	Inherits: TGMCGrenade
	Range: 9c0
	ReloadDelay: 90
	Report: sadar-fire-1.ogg, sadar-fire-2.ogg, sadar-fire-3.ogg
	# A rocket, not a lobbed grenade: it flies straight and fast, pointing along its path, and leaves a trail of smoke.
	Projectile: Shell
		WhistleSounds: rocket-whistle.ogg
		WhistleLead: 25
		Speed: 330
		Image: fx-rocket
		Sequences: idle
		Shadow: false
		LaunchAngle: 0
		Blockable: false
		ContrailLength: 14
		ContrailStartColor: ffffffcc
		ContrailEndColor: 9a9a9a00
		ContrailZOffset: 2047
		TrailImage: fx-light
		TrailSequences: rocket
		TrailInterval: 3
	# A rocket bursts in a fireball, and the ground shudders.
	Warhead@2Boom: CreateEffect
		Image: fx-blast
		Explosions: fireball
		ImpactSounds: explosion-1.ogg, explosion-2.ogg, explosion-3.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@9Light4: CreateEffect
		Image: fx-light
		Explosions: blast
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@7Shake: ShakeScreen
		Duration: 10
		Intensity: 3
		Multiplier: 1, 1
	Warhead@7Flash: FlashScreen
		Duration: 5
		Strength: 22
	Warhead@1Dam: ExplosiveDamage
		Damage: 80
		# TGMC's SADAR rocket: devastation 0, heavy 4, light 6.
		Range: 0c0, 1c0, 4c0, 6c0
		Falloff: 100, 85, 40, 0
		Versus:
			Heavy: 120

TGMCMortar:
	Inherits: TGMCGrenade
	Range: 14c0
	MinRange: 3c0
	ReloadDelay: 100
	Report: mortar-fire.ogg
	# The shell whistles at the spot where it will land, shortly before it does.
	Projectile: Shell
		Image: mortar-shell
		WhistleSounds: mortar-whistle.ogg, mortar-long-whistle.ogg
		WhistleLead: 50
	# A mortar shell: a blast about five cells across like TGMC's (devastation 1, heavy 2, light 5), a shake, and dust that hangs over the ground.
	Warhead@2Boom: CreateEffect
		Image: fx-blast-mortar
		Explosions: boom
		ImpactSounds: explosion-big.ogg
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@9Light5: CreateEffect
		Image: fx-light
		Explosions: blast
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@3Dust: CreateEffect
		Delay: 14
		Image: fx-dust-mortar
		Explosions: dust
		ForceDisplayAtGroundLevel: true
		ValidTargets: Ground, Water, Structure
	Warhead@7Shake: ShakeScreen
		Duration: 14
		Intensity: 5
		Multiplier: 1, 1
	Warhead@7Flash: FlashScreen
		Duration: 6
		Strength: 24
	-Warhead@1Dam:
	Warhead@1Wave: Shockwave
		Damage: 70
		Radius: 5
		RingDelay: 2
		EdgePercent: 6
		DustImage: fx-dust-tile
		DustChance: 20
		DamageTypes: ExplosionDeath
		ValidRelationships: Ally, Neutral, Enemy

