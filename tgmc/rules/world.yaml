^BaseWorld:
	Inherits: ^Palettes
	ActorMap:
	ScreenMap:
	Selection:
	ControlGroups:
	MusicPlaylist:
	LoadWidgetAtGameStart:
	CreateMapPlayers:
	MapOptions:
		ShortGameCheckboxEnabled: false
		TechLevelDropdownVisible: false
	MapStartingLocations:
	ScriptTriggers:
	ValidateOrder:
	ObjectivesPanel:
		PanelName: SKIRMISH_STATS
	SpawnMapActors:
	TerrainRenderer:
	ColorPickerManager:
		PreviewActor: rifleman
		PresetColors: FF3B3B, 3BA0FF, 3BFF5C, FFE03B, FF8A1F, B05CFF, 3BFFF0, D9D9D9
	PathFinder:
	BuildingInfluence:
	Locomotor@FOOT:
		Name: foot
		SharesCell: true
		TerrainSpeeds:
			Clear: 100
	Faction@marines:
		Name: faction-marines.name
		InternalName: marines
		Side: Allies
	Faction@xenos:
		Name: faction-xenos.name
		InternalName: xenos
		Side: Soviet
	Faction@random:
		Name: faction-random.name
		InternalName: Random
		RandomFactionMembers: marines, xenos
		Side: Random

World:
	Inherits: ^BaseWorld

# Map editor and lobby marker for a starting position. Actors of this type are read by MapStartingLocations.
mpspawn:
	Interactable:
	Immobile:
		OccupiesSpace: false
