# The marine miner and the ore field it is repaired from (tgmc/rules/mapobjects.yaml). The sheets are cut from TGMC's drill by mod/make_placeholders.py
# (write_tgmc_miner_art): 32x48, standing on its tile, so the sprite is lifted 8 px. Without a TGMC checkout write_miner_art draws a 32 px stand-in instead.
miner:
	idle:
		Filename: miner.png
		Length: 4
		Tick: 100
		Offset: 0, -8
	icon:
		Filename: miner-icon.png

miner-field:
	idle:
		Filename: miner-field.png
		Length: 2
		Tick: 250
		Offset: 0, -8

# The miner upgrades' palette icons (tgmc/rules/upgrades.yaml): the miner's icon with a gold plus (drills) or a blue shield (housings),
# drawn by mod/make_placeholders.py. The idle frame is only there because an actor's image needs a main sequence.
upgrade-miner-drills:
	idle:
		Filename: upgrade-miner-drills.png
	icon:
		Filename: upgrade-miner-drills.png

upgrade-miner-housing:
	idle:
		Filename: upgrade-miner-housing.png
	icon:
		Filename: upgrade-miner-housing.png
