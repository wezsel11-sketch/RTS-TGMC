# Sequences that are not tied to a unit. clock.png is drawn by mod/make_placeholders.py (no TGMC art).
clock:
	idle:
		Filename: clock.png
		Length: *

# The rally point marker. Both sheets are drawn by mod/make_placeholders.py (no TGMC art).
rallypoint:
	flag:
		Filename: rally-flag.png
		Length: 4
		Tick: 120
		Offset: 8, -12
		ZOffset: 2535
	circles:
		Filename: rally-circles.png
		Length: 4
		Tick: 160
		ZOffset: 2047

# Medic and engineer signals: a heal's three green crosses and a repair's rocking wrench. Both sheets are drawn by
# mod/make_placeholders.py (no TGMC art). The weapons in weapons.yaml name these actors as their effect Image.
heal-plus:
	idle:
		Filename: heal-plus.png
		Length: 8
		Tick: 100
		ZOffset: 2000

repair-wrench:
	idle:
		Filename: repair-wrench.png
		Length: 8
		Tick: 100
		ZOffset: 2000

# The move-order click effect (OpenRA's terrain flash). Drawn by mod/make_placeholders.py (no TGMC art).
moveflsh:
	idle:
		Filename: moveflsh.png
		Length: 4
		Tick: 60
		ZOffset: 2000

