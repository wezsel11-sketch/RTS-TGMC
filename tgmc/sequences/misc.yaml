# Lighting: soft additive glows (drawn by mod/make_placeholders.py, no TGMC art) that brighten the ground around a muzzle flash, a blast,
# a splash of acid or a fire. Weapons name them in an extra CreateEffect warhead; MuzzleGlow (tgmc/code/Lights.cs) plays the muzzle ones.
