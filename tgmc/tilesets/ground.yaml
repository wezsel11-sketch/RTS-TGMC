General:
	Name: tileset-tgmc
	Id: TGMC
	TileSize: 32, 32
	SheetSize: 512
	EditorTemplateOrder: Terrain, Road, Water
	HeightDebugColors: AA0000

# Colours are the radar's view of each terrain; they match the averages build_tileset.py reports.
Terrain:
	TerrainType@Clear:
		Type: Clear
		TargetTypes: Ground
		Color: 2C482A
	TerrainType@Road:
		Type: Road
		TargetTypes: Ground
		Color: 5C4C37
	TerrainType@Ford:
		Type: Ford
		TargetTypes: Ground
		Color: 72817E
	TerrainType@Water:
		Type: Water
		TargetTypes: Water
		Color: 456D8C
	TerrainType@Rock:
		Type: Rock
		TargetTypes: Rock
		Color: 8B8B8B
	# The walls of the converted maps: rock to walk, but heavy weapons can knock them down (DestructibleWalls).
	TerrainType@Wall:
		Type: Wall
		TargetTypes: Rock
		Color: 8C8C94
	TerrainType@ReinforcedWall:
		Type: ReinforcedWall
		TargetTypes: Rock
		Color: 6E6E78

