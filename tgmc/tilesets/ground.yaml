General:
	Name: tileset-tgmc
	Id: TGMC
	TileSize: 32, 32
	SheetSize: 512
	EditorTemplateOrder: Terrain, Road, Water, Blocked
	HeightDebugColors: AA0000

# Colours are the radar's view of each terrain; they match the averages build_tileset.py reports.
Terrain:
	TerrainType@Clear:
		Type: Clear
		TargetTypes: Ground
		Color: 2E5230
	TerrainType@Road:
		Type: Road
		TargetTypes: Ground
		Color: 5C4C37
	TerrainType@Ford:
		Type: Ford
		TargetTypes: Ground
		Color: 92A6A1
	TerrainType@Water:
		Type: Water
		TargetTypes: Water
		Color: 4D86B8
	# Nothing walks on these: they are not in the foot locomotor's TerrainSpeeds (rules/world.yaml).
	TerrainType@Rock:
		Type: Rock
		TargetTypes: Ground
		Color: 3E352D
	TerrainType@Wall:
		Type: Wall
		TargetTypes: Ground
		Color: 8A9298
	TerrainType@Brush:
		Type: Brush
		TargetTypes: Ground
		Color: 22381F

